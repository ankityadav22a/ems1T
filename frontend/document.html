<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!-- Sidebar -->

    <div class="fixed left-0 top-0 h-screen w-56 bg-[#1f2937] text-white p-5">
      <h2 class="text-xl font-bold mb-6">EMS Menu</h2>

      <ul class="flex flex-col gap-3">
        <li>
          <a
            href="index.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Dashboard</a
          >
        </li>

        <li>
          <a
            href="employee.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Employees</a
          >
        </li>

        <li>
          <a
            href="projects.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Projects</a
          >
        </li>

        <li>
          <a
            href="leaves.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Leaves</a
          >
        </li>

        <li>
          <a href="document.html" class="block px-4 py-2 bg-blue-600 rounded"
            >Document</a
          >
        </li>

        <li>
          <a
            href="profile.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Profile</a
          >
        </li>
        <li>
          <a
            href="payroll.html"
            class="block px-4 py-2 bg-[ #1f2937] text-white rounded hover:bg-blue-600"
            >Payroll</a
          >
        </li>

        <li>
          <a
            href="clients.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Clients</a
          >
        </li>

        <li>
          <a
            href="reports.html"
            class="block px-4 py-2 bg-[#1f2937] rounded hover:bg-blue-600"
            >Reports</a
          >
        </li>
      </ul>
    </div>

    <!-- Back Button -->

    <button
      onclick="history.back()"
      class="fixed top-5 right-5 bg-blue-500 text-white px-4 py-2 rounded shadow hover:bg-blue-600"
    >
      Back
    </button>

    <!-- Main Content -->

    <div class="ml-60 p-8">
      <h1 class="text-3xl font-bold mb-6">Document Management</h1>

      <!-- Document Upload Form -->

      <div class="bg-white p-6 rounded shadow mb-6">
        <h2 class="text-xl font-semibold mb-4">Upload Document</h2>

        <div class="grid grid-cols-2 gap-4">
          <input
            id="docName"
            type="text"
            placeholder="Document Name"
            class="border p-2 rounded"
          />

          <select id="category" class="border p-2 rounded">
            <option value="Ongoing Project">Ongoing Project</option>
            <option value="Finished Project">Finished Project</option>
            <option value="Office Employee">Office Employee</option>
          </select>

          <input
            id="employee"
            type="text"
            placeholder="Employee Name"
            class="border p-2 rounded"
          />

          <input id="file" type="file" class="border p-2 rounded" />
        </div>

        <button
          onclick="addDocument()"
          class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        >
          Upload Document
        </button>
      </div>

      <!-- Document Table -->

      <div class="bg-white rounded shadow overflow-hidden">
        <table class="w-full text-left">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Document</th>
              <th class="p-3">Category</th>
              <th class="p-3">Employee</th>
              <th class="p-3">File</th>
            </tr>
          </thead>

          <tbody id="documentTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      let documents = [];

      function addDocument() {
        let name = document.getElementById("docName").value;
        let category = document.getElementById("category").value;
        let employee = document.getElementById("employee").value;
        let file = document.getElementById("file").files[0];

        let doc = {
          id: documents.length + 1,
          name,
          category,
          employee,
          file: file ? file.name : "No File",
        };

        documents.push(doc);

        renderDocuments();
      }

      function renderDocuments() {
        let table = document.getElementById("documentTable");

        table.innerHTML = "";

        documents.forEach((d) => {
          table.innerHTML += `
<tr class="border-b hover:bg-gray-50">
<td class="p-3">${d.id}</td>
<td class="p-3">${d.name}</td>
<td class="p-3">${d.category}</td>
<td class="p-3">${d.employee}</td>
<td class="p-3">${d.file}</td>
</tr>
`;
        });
      }
    </script>
  </body>
</html>
