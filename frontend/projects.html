<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Projects - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .modal-scroll {
        max-height: 85vh;
        overflow-y: auto;
      }
      /* Custom scrollbar for sidebar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <main id="main-content" class="md:ml-56 mt-20 p-8">
      <div class="flex justify-between items-end mb-8">
        <div>
          <p class="text-gray-500 text-sm">Welcome back,</p>
          <h1 class="text-3xl font-black text-slate-800">Projects</h1>
        </div>
        <div class="flex items-center gap-4">
          <div
            class="hidden sm:block text-sm bg-blue-50 text-blue-700 px-4 py-2 rounded-full border border-blue-100 font-bold"
          >
            Portfolio Spend: $<span id="portfolioCost">0</span>
          </div>
          <button
            onclick="alert('New Project logic can be added here')"
            class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 shadow-lg"
          >
            + Create Project
          </button>
        </div>
      </div>

      <div
        class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8"
        id="projectGrid"
      ></div>
    </main>

    <div
      id="projectModal"
      class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl modal-scroll relative overflow-hidden"
      >
        <div class="h-2 bg-blue-600 w-full"></div>
        <button
          onclick="closeModal()"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 text-2xl transition-colors"
        >
          ✖
        </button>

        <div class="p-8">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-7">
              <div class="flex items-center gap-3 mb-2">
                <span
                  id="modalStatusBadge"
                  class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider"
                ></span>
                <h2
                  id="modalTitle"
                  class="text-3xl font-black text-slate-900"
                ></h2>
              </div>
              <p
                id="modalDuration"
                class="text-blue-600 font-bold text-sm mb-6"
              ></p>

              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4"
              >
                Roadmap & Timeline
              </h3>
              <div
                class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-6"
                style="height: 250px"
              >
                <canvas id="roadmapChart"></canvas>
              </div>

              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2"
              >
                Project Brief
              </h3>
              <p id="modalDesc" class="text-slate-600 leading-relaxed mb-6"></p>

              <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Budget</span
                  >
                  <span
                    id="modalBudget"
                    class="text-lg font-black text-slate-800"
                  ></span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Staffing</span
                  >
                  <span
                    id="modalEmpReq"
                    class="text-lg font-black text-slate-800"
                  ></span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Completion</span
                  >
                  <span
                    id="modalProgressText"
                    class="text-lg font-black text-blue-600"
                  ></span>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
              <div>
                <h3
                  class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"
                >
                  Resource Stack
                </h3>
                <p
                  id="modalResources"
                  class="text-sm bg-slate-800 text-slate-200 p-3 rounded-lg font-mono"
                ></p>
              </div>

              <div>
                <h3
                  class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"
                >
                  Task Matrix
                </h3>
                <div id="modalTasks" class="space-y-2"></div>
              </div>

              <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="font-bold text-slate-800">Expense Ledger</h3>
                  <button
                    onclick="showBillPopup()"
                    class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-blue-700 transition"
                  >
                    + Add Bill
                  </button>
                </div>
                <div class="max-h-40 overflow-y-auto mb-4">
                  <table class="w-full text-xs">
                    <tbody id="modalBillsList"></tbody>
                  </table>
                </div>
                <div
                  class="flex justify-between items-center pt-3 border-t border-slate-200"
                >
                  <span class="text-xs font-bold text-slate-400 uppercase"
                    >Total Utilization</span
                  >
                  <span
                    id="modalTotalSpent"
                    class="text-xl font-black text-red-600"
                  ></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="billPopup"
      class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-[100] p-4"
    >
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
        <h3 class="text-xl font-black mb-6 text-slate-800">Register Expense</h3>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1"
          >Description</label
        >
        <input
          id="billName"
          type="text"
          placeholder="e.g. AWS Credits"
          class="w-full border p-3 mb-4 rounded-xl bg-slate-50"
        />
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1"
          >Cost (USD)</label
        >
        <input
          id="billAmount"
          type="number"
          placeholder="0.00"
          class="w-full border p-3 mb-6 rounded-xl bg-slate-50"
        />
        <div class="flex gap-3">
          <button
            onclick="submitBill()"
            class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold"
          >
            Post Bill
          </button>
          <button
            onclick="hideBillPopup()"
            class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>

    <script>
      let activeProjectName = null;
      let roadmapChart = null;

      const projects = [
        {
          name: "Website Redesign",
          status: "Ongoing",
          priority: "High",
          progress: 65,
          budget: 15000,
          start: "2026-02-10",
          deadline: "2026-05-15",
          description:
            "Overhauling the primary corporate portal with a headless CMS and modern UI components.",
          empRequired: 4,
          resources: "React, Tailwind, Strapi, AWS S3",
          employees: ["John D.", "Sarah L.", "Sonam"],
          tasks: [
            { title: "Design Sprint", status: "Complete" },
            { title: "Frontend Build", status: "Ongoing" },
            { title: "API Linkage", status: "Upcoming" },
          ],
          bills: [
            { desc: "Stock Photos", cost: 150 },
            { desc: "Domain Renewal", cost: 50 },
          ],
        },
        {
          name: "Inventory System",
          status: "Upcoming",
          priority: "Medium",
          progress: 10,
          budget: 25000,
          start: "2026-06-01",
          deadline: "2026-10-30",
          description:
            "Real-time stock tracking application with QR code integration for the warehouse.",
          empRequired: 6,
          resources: "Node.js, MongoDB, Zebra Scanner SDK",
          employees: ["Mike R."],
          tasks: [
            { title: "DB Schema", status: "Ongoing" },
            { title: "Hardware Test", status: "Upcoming" },
          ],
          bills: [],
        },
      ];

      function renderProjects() {
        const grid = document.getElementById("projectGrid");
        let totalPortfolioSpent = 0;

        grid.innerHTML = projects
          .map((p) => {
            const spent = p.bills.reduce((acc, curr) => acc + curr.cost, 0);
            totalPortfolioSpent += spent;

            const statusTheme = {
              Ongoing: "bg-amber-100 text-amber-700",
              Upcoming: "bg-blue-100 text-blue-700",
              Complete: "bg-emerald-100 text-emerald-700",
              Halted: "bg-rose-100 text-rose-700",
            }[p.status];

            return `
            <div onclick="openProject('${p.name}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl hover:scale-[1.02] transition-all cursor-pointer group">
              <div class="flex justify-between items-start mb-6">
                <div class="${statusTheme} px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-tighter">${p.status}</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">#${p.priority} Priority</div>
              </div>
              
              <h3 class="text-xl font-black text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">${p.name}</h3>
              <p class="text-xs text-slate-400 mb-6 line-clamp-2">${p.description}</p>

              <div class="space-y-4 mb-6">
                <div class="flex justify-between text-[11px] font-bold uppercase tracking-widest text-slate-500">
                    <span>Utilization</span>
                    <span class="text-slate-800">$${spent} <span class="text-slate-300">/ $${p.budget}</span></span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-blue-600 h-full transition-all duration-700" style="width:${p.progress}%"></div>
                </div>
              </div>

              <div class="flex justify-between items-center border-t border-slate-50 pt-4">
                 <div class="flex -space-x-2">
                    ${p.employees.map((e) => `<div class="w-7 h-7 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-[10px] font-bold">${e[0]}</div>`).join("")}
                 </div>
                 <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${p.progress}% Ready</span>
              </div>
            </div>`;
          })
          .join("");

        document.getElementById("portfolioCost").innerText =
          totalPortfolioSpent.toLocaleString();
      }

      function openProject(name) {
        activeProjectName = name;
        const p = projects.find((proj) => proj.name === name);

        const badge = document.getElementById("modalStatusBadge");
        badge.innerText = p.status;
        badge.className = `px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${
          p.status === "Ongoing"
            ? "bg-amber-100 text-amber-700"
            : p.status === "Complete"
              ? "bg-emerald-100 text-emerald-700"
              : "bg-blue-100 text-blue-700"
        }`;

        document.getElementById("modalTitle").innerText = p.name;
        document.getElementById("modalDuration").innerText =
          `${p.start} — ${p.deadline}`;
        document.getElementById("modalDesc").innerText = p.description;
        document.getElementById("modalEmpReq").innerText =
          `${p.employees.length} / ${p.empRequired}`;
        document.getElementById("modalBudget").innerText =
          `$${p.budget.toLocaleString()}`;
        document.getElementById("modalResources").innerText = p.resources;
        document.getElementById("modalProgressText").innerText =
          `${p.progress}%`;

        document.getElementById("modalTasks").innerHTML = p.tasks
          .map(
            (t) => `
            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                <span class="text-sm font-bold text-slate-700">${t.title}</span>
                <span class="text-[10px] font-black uppercase px-2 py-1 rounded ${t.status === "Complete" ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${t.status}</span>
            </div>`,
          )
          .join("");

        const spent = p.bills.reduce((acc, curr) => acc + curr.cost, 0);
        document.getElementById("modalBillsList").innerHTML = p.bills
          .map(
            (b) =>
              `<tr class="border-b border-slate-50"><td class="py-2 text-slate-600">${b.desc}</td><td class="py-2 text-right font-bold text-slate-800">$${b.cost}</td></tr>`,
          )
          .join("");
        document.getElementById("modalTotalSpent").innerText =
          `$${spent.toLocaleString()}`;

        initChart(p);
        document
          .getElementById("projectModal")
          .classList.replace("hidden", "flex");
      }

      function initChart(project) {
        const ctx = document.getElementById("roadmapChart").getContext("2d");
        if (roadmapChart) roadmapChart.destroy();
        roadmapChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: project.tasks.map((t) => t.title),
            datasets: [
              {
                data: project.tasks.map((t) =>
                  t.status === "Complete"
                    ? 100
                    : t.status === "Ongoing"
                      ? 50
                      : 10,
                ),
                borderColor: "#2563eb",
                borderWidth: 4,
                backgroundColor: "rgba(37, 99, 235, 0.05)",
                fill: true,
                tension: 0.4,
                pointBackgroundColor: "#fff",
                pointBorderColor: "#2563eb",
                pointBorderWidth: 3,
                pointRadius: 6,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { display: false, min: 0, max: 110 },
              x: {
                grid: { display: false },
                ticks: { font: { size: 10, weight: "bold" } },
              },
            },
            plugins: { legend: { display: false } },
          },
        });
      }

      function showBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("hidden", "flex");
      }
      function hideBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("flex", "hidden");
      }
      function closeModal() {
        document
          .getElementById("projectModal")
          .classList.replace("flex", "hidden");
      }

      function submitBill() {
        const desc = document.getElementById("billName").value;
        const cost = parseFloat(document.getElementById("billAmount").value);
        if (desc && cost) {
          const p = projects.find((proj) => proj.name === activeProjectName);
          p.bills.push({ desc, cost });
          renderProjects();
          openProject(activeProjectName);
          hideBillPopup();
          document.getElementById("billName").value = "";
          document.getElementById("billAmount").value = "";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        // Render projects and show content after small delay
        setTimeout(() => {
          renderProjects();
          document.getElementById("main-content").classList.add("ready");

          // Highlight the current page in the injected sidebar
          const link = document.querySelector('a[href="projects.html"]');
          if (link) {
            link.classList.add("bg-blue-700", "font-semibold");
          }
        }, 400);
      });
    </script>
  </body>
</html>
