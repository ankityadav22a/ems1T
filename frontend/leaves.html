<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!-- HEADER -->
    <header
      class="fixed top-0 left-0 w-full bg-blue-900 text-white p-4 flex justify-between items-center z-50 shadow"
    >
      <!-- LEFT -->
      <div class="flex items-center gap-3">
        <img src="./EMSlogo.jpg" class="h-10" />
      </div>

      <!-- RIGHT -->
      <div class="flex items-center gap-4">
        <!-- BACK BUTTON IMAGE -->
        <img
          src="./back.png"
          onclick="history.back()"
          class="h-8 w-8 cursor-pointer hover:scale-110 transition"
          title="Go Back"
        />

        <!-- MENU BUTTON -->
        <button onclick="toggleSidebar()" class="md:hidden text-2xl">☰</button>
      </div>
    </header>

    <!-- SIDEBAR -->
    <div
      id="sidebar"
      class="fixed top-16 left-0 h-[calc(100%-4rem)] w-56 bg-gray-800 text-white p-5 transform -translate-x-full md:translate-x-0 transition duration-300 z-40"
    >
      <h2 class="text-xl font-bold mb-6">EMS Menu</h2>

      <ul class="flex flex-col gap-3 text-sm">
        <li>
          <a href="index.html" class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Dashboard</a
          >
        </li>
        <li>
          <a
            href="employee.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Employees</a
          >
        </li>
        <li>
          <a
            href="projects.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Projects</a
          >
        </li>
        <li>
          <a href="leaves.html" class="block px-4 py-2 bg-blue-600 rounded"
            >Leaves</a
          >
        </li>
        <li>
          <a
            href="document.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Documents</a
          >
        </li>
        <li>
          <a
            href="profile.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Profile</a
          >
        </li>
        <li>
          <a
            href="payroll.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Payroll</a
          >
        </li>
        <li>
          <a
            href="clients.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Clients</a
          >
        </li>
        <li>
          <a
            href="reports.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Reports</a
          >
        </li>
      </ul>
    </div>

    <!-- OVERLAY -->
    <div
      id="overlay"
      class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden"
      onclick="toggleSidebar()"
    ></div>

    <!-- MAIN -->
    <div class="ml-0 md:ml-56 mt-20 p-4">
      <h1 class="text-2xl md:text-3xl font-bold mb-6">Leave Management</h1>

      <!-- SEARCH -->
      <input
        id="searchBox"
        onkeyup="searchLeave()"
        placeholder="Search by ID or Name..."
        class="mb-4 w-full md:w-1/3 border p-2 rounded shadow"
      />

      <!-- FORM -->
      <div class="bg-white p-4 md:p-6 rounded shadow mb-6">
        <h2 class="text-lg font-semibold mb-4">Apply for Leave</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input
            id="empId"
            placeholder="Employee ID"
            class="border p-2 rounded"
          />
          <input
            id="name"
            placeholder="Employee Name"
            class="border p-2 rounded"
          />

          <select id="type" class="border p-2 rounded">
            <option>Sick Leave</option>
            <option>Casual Leave</option>
            <option>Annual Leave</option>
          </select>

          <input id="fromDate" type="date" class="border p-2 rounded" />
          <input id="toDate" type="date" class="border p-2 rounded" />
        </div>

        <button
          onclick="addLeave()"
          class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full md:w-auto"
        >
          Submit Leave
        </button>
      </div>

      <!-- TABLE -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left min-w-175">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Emp ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Type</th>
              <th class="p-3">From</th>
              <th class="p-3">To</th>
              <th class="p-3">Status</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="leaveTable"></tbody>
        </table>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      let leaves = JSON.parse(localStorage.getItem("leaves")) || [];

      renderLeaves();

      function toggleSidebar() {
        document
          .getElementById("sidebar")
          .classList.toggle("-translate-x-full");
        document.getElementById("overlay").classList.toggle("hidden");
      }

      function addLeave() {
        let empId = document.getElementById("empId").value.trim();
        let name = document.getElementById("name").value.trim();
        let type = document.getElementById("type").value;
        let from = document.getElementById("fromDate").value;
        let to = document.getElementById("toDate").value;

        if (!empId || !name || !from || !to) return alert("Fill all fields");

        if (leaves.some((l) => l.empId.toLowerCase() === empId.toLowerCase()))
          return alert("ID must be unique");

        leaves.push({ empId, name, type, from, to, status: "Pending" });
        localStorage.setItem("leaves", JSON.stringify(leaves));

        renderLeaves();
      }

      function updateStatus(i, status) {
        leaves[i].status = status;
        localStorage.setItem("leaves", JSON.stringify(leaves));
        renderLeaves();
      }

      function renderLeaves(data = leaves) {
        let table = document.getElementById("leaveTable");
        table.innerHTML = "";

        data.forEach((l, i) => {
          table.innerHTML += `
<tr class="border-b hover:bg-gray-50">
<td class="p-3">${l.empId}</td>
<td class="p-3">${l.name}</td>
<td class="p-3">${l.type}</td>
<td class="p-3">${l.from}</td>
<td class="p-3">${l.to}</td>
<td class="p-3 ${l.status == "Approved" ? "text-green-600" : l.status == "Rejected" ? "text-red-600" : "text-yellow-600"}">${l.status}</td>
<td class="p-3">
  <button onclick="updateStatus(${i},'Approved')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Approve</button>
  <button onclick="updateStatus(${i},'Rejected')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Reject</button>
</td>
</tr>`;
        });
      }

      function searchLeave() {
        let val = document.getElementById("searchBox").value.toLowerCase();

        let filtered = leaves.filter(
          (l) =>
            l.empId.toLowerCase().includes(val) ||
            l.name.toLowerCase().includes(val),
        );

        renderLeaves(filtered);
      }
    </script>
  </body>
</html>
