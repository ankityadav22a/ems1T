<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Projects - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .modal-scroll {
        max-height: 85vh;
        overflow-y: auto;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>
    <main id="main-content" class="md:ml-56 mt-20 p-8">
      <div class="flex justify-between items-end mb-8">
        <div>
          <p class="text-gray-500 text-sm">Welcome back,</p>
          <h1 class="text-3xl font-black text-slate-800">Projects</h1>
        </div>
        <div class="flex items-center gap-4">
          <div
            class="hidden sm:block text-sm bg-blue-50 text-blue-700 px-4 py-2 rounded-full border border-blue-100 font-bold"
          >
            Portfolio Spend: $<span id="portfolioCost">0</span>
          </div>
          <button
            onclick="toggleCreateModal()"
            class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 shadow-lg"
          >
            + Create Project
          </button>
        </div>
      </div>
      <input
        id="projectSearch"
        onkeyup="renderProjects()"
        placeholder="Search by Project Name or Client ID..."
        class="p-3 rounded-xl border w-full max-w-md mb-6"
      />
      <div class="flex gap-2 mb-6">
        <input
          id="minBudget"
          type="number"
          placeholder="Min Budget"
          class="p-2 border rounded"
        />
        <input
          id="maxBudget"
          type="number"
          placeholder="Max Budget"
          class="p-2 border rounded"
        />
        <button
          onclick="renderProjects()"
          class="bg-blue-600 text-white px-4 rounded"
        >
          Filter
        </button>
      </div>
      <div
        class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8"
        id="projectGrid"
      ></div>
    </main>

    <!-- Create / Edit Project Modal -->
    <div
      id="createProjectModal"
      class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[70] p-4 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl relative flex flex-col"
        style="max-height: 90vh"
      >
        <div class="overflow-y-auto p-8 flex-grow">
          <div class="h-2 bg-emerald-500 w-full shrink-0"></div>
          <div class="p-8 pb-4 shrink-0 relative">
            <button
              onclick="toggleCreateModal()"
              class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 text-2xl"
            >
              ✖
            </button>
            <h2
              id="createModalTitle"
              class="text-2xl font-black text-slate-800"
            >
              Initiate New Project
            </h2>
          </div>
          <div class="p-8 pt-0 overflow-y-auto flex-grow space-y-6">
            <div class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Project Name</label
                  >
                  <input
                    id="newProjName"
                    type="text"
                    class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >
                    Client ID
                  </label>
                  <input
                    id="newProjClientId"
                    type="text"
                    placeholder="CL-1001"
                    class="w-full border p-2.5 rounded-xl bg-slate-50"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Priority Level</label
                  >
                  <select
                    id="newProjPriority"
                    class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none"
                  >
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                  </select>
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Start Date</label
                  >
                  <input
                    id="newProjStart"
                    type="date"
                    class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Deadline</label
                  >
                  <input
                    id="newProjDeadline"
                    type="date"
                    class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Resources</label
                  >
                  <input
                    id="newProjResources"
                    type="text"
                    placeholder="e.g. React, Node.js, AWS"
                    class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                  />
                </div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div class="col-span-2">
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Short Description</label
                  >
                  <input
                    id="newProjDesc"
                    type="text"
                    placeholder="Brief overview..."
                    class="w-full border p-2.5 rounded-xl bg-slate-50"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                    >Budget ($)</label
                  >
                  <input
                    id="newProjBudget"
                    type="number"
                    placeholder="0"
                    class="w-full border p-2.5 rounded-xl bg-slate-50"
                  />
                </div>
              </div>

              <!-- Task Matrix -->
              <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-center mb-2">
                  <label
                    class="block text-[10px] font-bold text-blue-600 uppercase"
                    >Task Matrix</label
                  >
                  <button
                    onclick="addTaskRow()"
                    class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200"
                  >
                    + Add Task
                  </button>
                </div>
                <div id="taskInputsContainer" class="space-y-2"></div>
              </div>

              <!-- Team Members -->
              <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase"
                    >Team Members</label
                  >
                  <button
                    onclick="addEmpRow()"
                    class="text-[10px] bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold hover:bg-slate-300"
                  >
                    + Add Staff
                  </button>
                </div>
                <div id="empInputsContainer" class="space-y-2"></div>
              </div>

              <!-- Expenses -->
              <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-center mb-2">
                  <label
                    class="block text-[10px] font-bold text-red-500 uppercase"
                  >
                    Expenses
                  </label>
                  <button
                    onclick="addExpenseRow()"
                    class="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold"
                  >
                    + Add Expense
                  </button>
                </div>
                <div id="expenseInputsContainer" class="space-y-2"></div>
              </div>
            </div>
          </div>

          <div class="p-8 pt-4 border-t border-slate-100 bg-white shrink-0">
            <button
              id="submitProjectBtn"
              onclick="addNewProject()"
              class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-slate-800 transition-all shadow-lg"
            >
              Create Project
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Project Detail Modal -->
    <div
      id="projectModal"
      class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden"
      >
        <div class="h-2 bg-blue-600 w-full"></div>
        <div class="flex-1 overflow-y-auto p-6 md:p-8">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
              <div class="flex items-center gap-3 mb-2 flex-wrap">
                <span
                  id="modalStatusBadge"
                  class="px-3 py-1 rounded-full text-xs font-black uppercase"
                ></span>
                <h2
                  id="modalTitle"
                  class="text-2xl md:text-3xl font-black text-slate-900"
                ></h2>
                <button
                  onclick="editProject()"
                  class="ml-auto bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded text-xs font-bold"
                >
                  Edit
                </button>
                <button
                  onclick="closeModal()"
                  class="text-gray-400 hover:text-gray-900 text-xl font-bold ml-2"
                >
                  ✖
                </button>
              </div>
              <div class="bg-slate-50 p-3 rounded-xl">
                <span class="text-[10px] text-slate-400 font-bold"
                  >Client ID</span
                >
                <div id="modalClientId" class="font-black"></div>
              </div>
              <p
                id="modalDuration"
                class="text-blue-600 font-bold text-sm mb-4"
              ></p>

              <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">
                Roadmap & Timeline
              </h3>
              <div class="bg-slate-50 p-3 rounded-xl mb-4 h-[220px]">
                <canvas id="roadmapChart"></canvas>
              </div>

              <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">
                Project Brief
              </h3>
              <p id="modalDesc" class="text-slate-600 mb-4"></p>
              <div class="mb-4">
                <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">
                  Resources
                </h3>
                <p
                  id="modalResources"
                  class="text-xs bg-slate-800 text-white p-3 rounded-lg font-mono"
                ></p>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div class="bg-slate-50 p-3 rounded-xl">
                  <span class="text-[10px] text-slate-400 font-bold"
                    >Budget</span
                  >
                  <div id="modalBudget" class="font-black"></div>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl">
                  <span class="text-[10px] text-slate-400 font-bold"
                    >Staff</span
                  >
                  <div id="modalEmpReq" class="font-black"></div>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl">
                  <span class="text-[10px] text-slate-400 font-bold"
                    >Progress</span
                  >
                  <div
                    id="modalProgressText"
                    class="font-black text-blue-600"
                  ></div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
              <div>
                <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">
                  Tasks
                </h3>
                <div
                  id="modalTasks"
                  class="space-y-2 max-h-40 overflow-y-auto"
                ></div>
              </div>
              <div>
                <h3 class="text-sm font-bold text-slate-400 uppercase mb-2">
                  Team
                </h3>
                <div
                  id="modalEmployees"
                  class="space-y-2 max-h-40 overflow-y-auto"
                ></div>
              </div>
              <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between items-center mb-2">
                  <label
                    class="block text-[10px] font-bold text-red-500 uppercase"
                  >
                    Expenses Summary
                  </label>
                  <button
                    onclick="showBillPopup()"
                    class="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold"
                  >
                    + Add Expense
                  </button>
                </div>
                <table class="w-full text-xs">
                  <tbody id="modalBillsList"></tbody>
                </table>
                <div
                  class="text-right font-black mt-2"
                  id="modalTotalSpent"
                ></div>
              </div>
            </div>
            <div class="ml-auto flex gap-2">
              <button
                id="deleteProjectBtn"
                onclick="deleteProject()"
                class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1 rounded text-xs font-bold"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bill Popup -->
    <div
      id="billPopup"
      class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-[100] p-4"
    >
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
        <h3 class="text-xl font-black mb-6 text-slate-800">Register Expense</h3>
        <input
          id="billName"
          type="text"
          placeholder="Description"
          class="w-full border p-3 mb-4 rounded-xl bg-slate-50"
        />
        <input
          id="billAmount"
          type="number"
          placeholder="Cost (USD)"
          class="w-full border p-3 mb-6 rounded-xl bg-slate-50"
        />
        <div class="flex gap-3">
          <button
            onclick="submitBill()"
            class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold"
          >
            Post Bill
          </button>
          <button
            onclick="hideBillPopup()"
            class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>
    <script>
      let projects = [];
      let activeProjectName = null;
      let roadmapChart = null;
      let isEditing = false;
      let editingProjectId = null;
      let currentUser = null;

      async function loadCurrentUser() {
        try {
          const res = await fetch("/api/me", { credentials: "include" });
          if (!res.ok) throw new Error("Not authenticated");
          currentUser = await res.json();
        } catch (err) {
          console.error("Failed to load user:", err);
          window.location.href = "login.html";
        }
      }

      function canDeleteProject() {
        if (!currentUser) return false;
        return (
          currentUser.authority === "Owner" || currentUser.authority === "Admin"
        );
      }

      async function loadProjectsFromDB() {
        try {
          const res = await fetch("/api/projects");
          if (!res.ok) throw new Error("Failed to load projects");
          const data = await res.json();
          projects = data.map((p) => ({
            id: p.project_id,
            name: p.project_name,
            priority: p.priority,
            client_id: p.client_id,
            start: p.start_date,
            deadline: p.deadline,
            description: p.short_description,
            budget: p.budget || 0,
            resources: p.resources || "",
            status: p.status || "Upcoming",
            employees: p.team
              ? p.team.map((t) => t.employee_name || "Unknown")
              : [],
            team: p.team || [],
            tasks: p.tasks || [],
            bills: p.expenses
              ? p.expenses.map((e) => ({
                  desc: e.expense_name,
                  cost: Number(e.expense_cost),
                }))
              : [],
          }));
          renderProjects();
        } catch (err) {
          console.error(err);
          alert("Failed to load projects: " + err.message);
        }
      }

      function formatDate(dateStr) {
        if (!dateStr) return "N/A";
        const d = new Date(dateStr);
        return `${d.getDate().toString().padStart(2, "0")}-${(d.getMonth() + 1).toString().padStart(2, "0")}-${d.getFullYear()}`;
      }

      function calculateProgress(tasks) {
        if (!tasks || tasks.length === 0) return 0;
        const completed = tasks.filter((t) => t.status === "Complete").length;
        return Math.round((completed / tasks.length) * 100);
      }

      function renderProjects() {
        const q =
          document
            .getElementById("projectSearch")
            ?.value.toLowerCase()
            .trim() || "";
        const min = parseInt(document.getElementById("minBudget")?.value) || 0;
        const max =
          parseInt(document.getElementById("maxBudget")?.value) || Infinity;
        const filtered = projects.filter(
          (p) =>
            (p.name.toLowerCase().includes(q) ||
              (p.client_id || "").toLowerCase().includes(q)) &&
            p.budget >= min &&
            p.budget <= max,
        );
        const grid = document.getElementById("projectGrid");
        let totalPortfolioSpent = 0;
        grid.innerHTML = filtered
          .map((p) => {
            const progress = calculateProgress(p.tasks);
            const spent = p.bills.reduce((acc, b) => acc + (b.cost || 0), 0);
            totalPortfolioSpent += spent;
            const status = calculateProjectStatus(p.tasks) || "Upcoming";
            const statusTheme =
              {
                Ongoing: "bg-amber-100 text-amber-700",
                Complete: "bg-emerald-100 text-emerald-700",
                Halted: "bg-rose-100 text-rose-700",
              }[status] || "bg-blue-100 text-blue-700";
            return `<div onclick="openProject('${p.name.replace(/'/g, "\\'")}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl hover:scale-[1.02] transition-all cursor-pointer group"><div class="flex justify-between items-start mb-6"><div class="${statusTheme} px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-tighter">${status}</div><div class="text-[10px] font-bold text-slate-400 uppercase">#${p.priority} Priority</div></div><h3 class="text-xl font-black text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">${p.name}</h3><p class="text-xs text-slate-400 mb-6 line-clamp-2">${p.description || ""}</p><div class="space-y-4 mb-6"><div class="flex justify-between text-[11px] font-bold uppercase tracking-widest text-slate-500"><span>Utilization</span><span class="text-slate-800">$${spent} <span class="text-slate-300">/ $${p.budget}</span></span></div><div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-blue-600 h-full transition-all duration-700" style="width:${progress}%"></div></div></div><div class="flex justify-between items-center border-t border-slate-50 pt-4"><div class="flex -space-x-2">${p.employees
              .slice(0, 4)
              .map(
                (e) =>
                  `<div class="w-7 h-7 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-[10px] font-bold">${(e || "?")[0]}</div>`,
              )
              .join(
                "",
              )}</div><span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${progress}% Ready</span></div></div>`;
          })
          .join("");
        document.getElementById("portfolioCost").innerText =
          totalPortfolioSpent.toLocaleString();
      }

      function toggleCreateModal() {
        const modal = document.getElementById("createProjectModal");
        modal.classList.toggle("hidden");
        modal.classList.toggle("flex");
        if (modal.classList.contains("hidden")) resetCreateForm();
      }
      function resetCreateForm() {
        isEditing = false;
        editingProjectId = null;
        document.getElementById("createModalTitle").innerText =
          "Initiate New Project";
        document.getElementById("submitProjectBtn").innerText =
          "Create Project";
        document.getElementById("newProjName").value = "";
        document.getElementById("newProjName").disabled = false;
        document.getElementById("newProjClientId").value = "";
        document.getElementById("newProjPriority").value = "Medium";
        document.getElementById("newProjDesc").value = "";
        document.getElementById("newProjBudget").value = "";
        document.getElementById("newProjStart").value = "";
        document.getElementById("newProjDeadline").value = "";
        document.getElementById("newProjResources").value = "";
        document.getElementById("taskInputsContainer").innerHTML = "";
        document.getElementById("empInputsContainer").innerHTML = "";
        document.getElementById("expenseInputsContainer").innerHTML = "";
      }
      function addTaskRow(data = null) {
        const container = document.getElementById("taskInputsContainer");
        const div = document.createElement("div");
        div.className = "task-row flex gap-2";
        div.innerHTML = `<input type="text" placeholder="Task Name" class="flex-grow border p-2 rounded-lg bg-slate-50 text-xs t-name" value="${data ? data.title || data.name || "" : ""}"><input type="date" class="w-32 border p-2 rounded-lg bg-slate-50 text-xs t-date" value="${data ? formatDateForInput(data.deadline) : ""}"><select class="w-28 border p-2 rounded-lg bg-slate-50 text-xs t-status"><option value="Upcoming" ${data?.status === "Upcoming" ? "selected" : ""}>Upcoming</option><option value="Ongoing" ${data?.status === "Ongoing" ? "selected" : ""}>Ongoing</option><option value="Complete" ${data?.status === "Complete" ? "selected" : ""}>Complete</option></select><button onclick="this.parentElement.remove()" class="text-rose-500 hover:bg-rose-50 px-2 rounded-lg">✕</button>`;
        container.appendChild(div);
      }
      function formatDateForInput(dateStr) {
        if (!dateStr) return "";
        return new Date(dateStr).toISOString().split("T")[0];
      }
      function addEmpRow(data = null) {
        const container = document.getElementById("empInputsContainer");
        const div = document.createElement("div");
        div.className = "emp-row flex gap-2";
        div.innerHTML = `<input type="text" placeholder="Employee ID" class="w-40 border p-2 rounded-lg bg-white text-xs e-id" value="${data ? data.employee_id || data.id || "" : ""}" onblur="fetchEmployeeName(this)"/><span class="flex-grow p-2 text-xs font-bold text-blue-600 e-name">${data ? data.employee_name || data.name || "" : ""}</span><input type="text" placeholder="Work/Role" class="w-28 border p-2 rounded-lg bg-white text-xs e-pos" value="${data ? data.work || "" : ""}"/><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-rose-500 px-1">✕</button>`;
        container.appendChild(div);
      }
      async function fetchEmployeeName(input) {
        const empId = input.value.trim();
        if (!empId) return;
        const row = input.closest(".emp-row");
        const nameField = row.querySelector(".e-name");
        try {
          const res = await fetch(`/api/employees/${empId}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          nameField.innerText = data.employee_name || data.name || "Not Found";
        } catch (err) {
          nameField.innerText = "Not Found";
        }
      }
      async function addNewProject() {
        const name = document.getElementById("newProjName").value.trim();
        if (!name) {
          alert("Project name is required!");
          return;
        }
        const client_id = document
          .getElementById("newProjClientId")
          .value.trim();
        const priority = document.getElementById("newProjPriority").value;
        const desc = document.getElementById("newProjDesc").value;
        const budget =
          parseInt(document.getElementById("newProjBudget").value) || 0;
        const startDate = document.getElementById("newProjStart").value;
        const deadlineDate = document.getElementById("newProjDeadline").value;
        const resources = document.getElementById("newProjResources").value;
        const tasks = Array.from(document.querySelectorAll(".task-row")).map(
          (row) => ({
            title: row.querySelector(".t-name").value,
            deadline: row.querySelector(".t-date").value,
            status: row.querySelector(".t-status").value,
          }),
        );
        const team = Array.from(document.querySelectorAll(".emp-row"))
          .filter((row) => row.querySelector(".e-id").value.trim())
          .map((row) => ({
            employee_id: row.querySelector(".e-id").value.trim(),
            work: row.querySelector(".e-pos").value,
          }));
        const expenses = Array.from(
          document.querySelectorAll(".expense-row"),
        ).map((row) => ({
          name: row.querySelector(".ex-name").value,
          cost: parseFloat(row.querySelector(".ex-cost").value) || 0,
        }));
        const projectStatus = calculateProjectStatus(tasks);
        const payload = {
          project_name: name,
          priority,
          start_date: startDate,
          deadline: deadlineDate,
          resources,
          short_description: desc,
          status: projectStatus,
          budget,
          tasks,
          team,
          expenses,
          client_id: client_id || null,
        };
        try {
          let res;
          if (isEditing && editingProjectId)
            res = await fetch(`/api/projects/${editingProjectId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          else
            res = await fetch("/api/projects", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          if (!res.ok) throw new Error();
          toggleCreateModal();
          await loadProjectsFromDB();
        } catch (err) {
          alert("❌ Project saving error");
        }
      }
      function calculateProjectStatus(tasks) {
        if (!tasks || tasks.length === 0) return "Upcoming";
        const allComplete = tasks.every((t) => t.status === "Complete");
        const anyOngoing = tasks.some((t) => t.status === "Ongoing");
        if (allComplete) return "Complete";
        if (anyOngoing) return "Ongoing";
        return "Upcoming";
      }
      function editProject() {
        const p = projects.find((proj) => proj.name === activeProjectName);
        if (!p) return;
        closeModal();
        toggleCreateModal();
        isEditing = true;
        editingProjectId = p.id;
        document.getElementById("createModalTitle").innerText = "Edit Project";
        document.getElementById("submitProjectBtn").innerText = "Save Changes";
        document.getElementById("newProjName").value = p.name;
        document.getElementById("newProjClientId").value = p.client_id || "";
        document.getElementById("newProjPriority").value = p.priority;
        document.getElementById("newProjDesc").value = p.description || "";
        document.getElementById("newProjBudget").value = p.budget;
        document.getElementById("newProjStart").value = formatDateForInput(
          p.start,
        );
        document.getElementById("newProjDeadline").value = formatDateForInput(
          p.deadline,
        );
        document.getElementById("newProjResources").value = p.resources || "";
        document.getElementById("taskInputsContainer").innerHTML = "";
        (p.tasks || []).forEach((t) => addTaskRow(t));
        document.getElementById("empInputsContainer").innerHTML = "";
        (p.team || []).forEach((emp) =>
          addEmpRow({
            employee_id: emp.employee_id,
            employee_name: emp.employee_name,
            work: emp.work,
          }),
        );
        const expenseContainer = document.getElementById(
          "expenseInputsContainer",
        );
        if (expenseContainer) {
          expenseContainer.innerHTML = "";
          (p.bills || []).forEach((b) => addExpenseRow(b));
        }
      }

      function openProject(name) {
        activeProjectName = name;
        const p = projects.find((proj) => proj.name === name);
        if (!p) return;
        const deleteBtn = document.getElementById("deleteProjectBtn");
        if (deleteBtn)
          deleteBtn.style.display = canDeleteProject()
            ? "inline-block"
            : "none";
        const status = calculateProjectStatus(p.tasks) || "Upcoming";
        const badge = document.getElementById("modalStatusBadge");
        badge.innerText = status;
        badge.className = `px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${status === "Ongoing" ? "bg-amber-100 text-amber-700" : status === "Complete" ? "bg-emerald-100 text-emerald-700" : "bg-blue-100 text-blue-700"}`;
        document.getElementById("modalTitle").innerText = p.name;
        document.getElementById("modalClientId").innerText =
          p.client_id || "N/A";
        document.getElementById("modalDuration").innerText =
          `${formatDate(p.start || "N/A")} — ${formatDate(p.deadline || "N/A")}`;
        document.getElementById("modalDesc").innerText = p.description || "";
        document.getElementById("modalEmpReq").innerText =
          `${p.employees.length} Staff`;
        document.getElementById("modalBudget").innerText =
          `$${p.budget.toLocaleString()}`;
        document.getElementById("modalResources").innerText =
          p.resources || "No resources listed";
        const progress = calculateProgress(p.tasks);
        document.getElementById("modalProgressText").innerText = `${progress}%`;
        document.getElementById("modalTasks").innerHTML = (p.tasks || [])
          .map(
            (t) =>
              `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100"><span class="text-sm font-bold text-slate-700">${t.title}</span><span class="text-[10px] font-black uppercase px-2 py-1 rounded ${t.status === "Complete" ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${t.status}</span></div>`,
          )
          .join("");
        document.getElementById("modalEmployees").innerHTML = (p.team || [])
          .filter((emp) => emp && emp.employee_id)
          .map(
            (emp) =>
              `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100"><div><span class="text-sm font-bold text-slate-700">${emp.employee_name || "Unknown"}</span><span class="text-xs text-slate-400 ml-2">${emp.employee_id || ""}</span></div><span class="text-[10px] font-black uppercase px-2 py-1 rounded bg-blue-100 text-blue-700">${emp.work || "No Role"}</span></div>`,
          )
          .join("");
        const spent = p.bills.reduce((acc, b) => acc + (b.cost || 0), 0);
        document.getElementById("modalBillsList").innerHTML = (p.bills || [])
          .map(
            (b) =>
              `<tr class="border-b border-slate-50"><td class="py-2 text-slate-600">${b.desc || b.name || "N/A"}</td><td class="py-2 text-right font-bold text-slate-800">$${b.cost || 0}</td></tr>`,
          )
          .join("");
        document.getElementById("modalTotalSpent").innerText =
          `$${spent.toLocaleString()}`;
        initChart(p);
        document
          .getElementById("projectModal")
          .classList.replace("hidden", "flex");
      }

      async function deleteProject() {
        if (!canDeleteProject()) {
          alert("❌ No permission");
          return;
        }
        if (!confirm("Delete project?")) return;
        const p = projects.find((proj) => proj.name === activeProjectName);
        if (!p) return;
        try {
          await fetch(`/api/projects/${p.id}`, { method: "DELETE" });
          closeModal();
          await loadProjectsFromDB();
        } catch (err) {
          alert("Failed to delete");
        }
      }

      function addExpenseRow(data = null) {
        const container = document.getElementById("expenseInputsContainer");
        if (!container) return;
        const div = document.createElement("div");
        div.className = "expense-row flex gap-2";
        div.innerHTML = `<input type="text" placeholder="Expense Name" class="flex-grow border p-2 rounded-lg bg-slate-50 text-xs ex-name" value="${data ? data.desc || data.name || "" : ""}"><input type="number" placeholder="Cost" class="w-28 border p-2 rounded-lg bg-slate-50 text-xs ex-cost" value="${data ? data.cost || "" : ""}"><button onclick="this.parentElement.remove()" class="text-rose-500 px-2">✕</button>`;
        container.appendChild(div);
      }
      function showBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("hidden", "flex");
      }
      function hideBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("flex", "hidden");
      }
      function closeModal() {
        document
          .getElementById("projectModal")
          .classList.replace("flex", "hidden");
      }
      function submitBill() {
        const desc = document.getElementById("billName").value;
        const cost = parseFloat(document.getElementById("billAmount").value);
        if (!desc || !cost) {
          alert("Enter description & amount");
          return;
        }
        const p = projects.find((proj) => proj.name === activeProjectName);
        if (p) {
          p.bills.push({ desc, cost });
          renderProjects();
          openProject(activeProjectName);
        }
        hideBillPopup();
        document.getElementById("billName").value = "";
        document.getElementById("billAmount").value = "";
      }

      // FIXED: Chart with proper progress display
      // Complete tasks: show actual cumulative progress from graph
      // Ongoing tasks: show actual cumulative progress from graph
      // Upcoming tasks: show 0%
      function initChart(project) {
        const ctx = document.getElementById("roadmapChart").getContext("2d");
        if (roadmapChart) roadmapChart.destroy();

        const tasks = project.tasks || [];
        if (tasks.length === 0) {
          roadmapChart = new Chart(ctx, {
            type: "line",
            data: {
              labels: ["Start"],
              datasets: [
                {
                  data: [0],
                  borderColor: "#94a3b8",
                  borderWidth: 3,
                  pointRadius: 5,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                tooltip: { callbacks: { label: () => "No tasks defined" } },
              },
            },
          });
          return;
        }

        // Sort tasks by status order: Complete, Ongoing, Upcoming
        const sortedTasks = [...tasks].sort((a, b) => {
          const order = { Complete: 1, Ongoing: 2, Upcoming: 3 };
          return order[a.status] - order[b.status];
        });

        const labels = [
          "Start",
          ...sortedTasks.map((t) =>
            t.title.length > 22 ? t.title.slice(0, 19) + "..." : t.title,
          ),
        ];
        const step = 100 / (sortedTasks.length || 1);
        let cumulative = 0;
        const dataPoints = [0];

        for (let i = 0; i < sortedTasks.length; i++) {
          const task = sortedTasks[i];
          let increment = 0;
          if (task.status === "Complete") increment = step;
          else if (task.status === "Ongoing") increment = step / 2;
          else increment = 0;
          cumulative += increment;
          dataPoints.push(cumulative);
        }

        // Store task progress values for tooltip
        const taskProgressValues = [...dataPoints];

        // Create segment colors based on the RIGHT point's status (the task at index i+1)
        const segmentColors = [];
        for (let i = 0; i < sortedTasks.length; i++) {
          const task = sortedTasks[i];
          if (task.status === "Complete") segmentColors.push("#10b981");
          else if (task.status === "Ongoing") segmentColors.push("#3b82f6");
          else segmentColors.push("#ef4444");
        }

        // Build dataset with segment styling
        const dataset = {
          data: dataPoints,
          borderWidth: 4,
          fill: false,
          tension: 0.3,
          pointRadius: 6,
          pointHoverRadius: 9,
          pointBackgroundColor: "#ffffff",
          pointBorderWidth: 3,
          segment: {
            borderColor: (ctx) => {
              const index = ctx.p0DataIndex;
              if (index >= 0 && index < segmentColors.length) {
                return segmentColors[index];
              }
              return "#94a3b8";
            },
          },
        };

        // Add point border colors matching task status
        dataset.pointBorderColor = (ctx) => {
          const index = ctx.dataIndex;
          if (index === 0) return "#eab308";
          const task = sortedTasks[index - 1];
          if (!task) return "#94a3b8";
          if (task.status === "Complete") return "#10b981";
          if (task.status === "Ongoing") return "#3b82f6";
          return "#ef4444";
        };

        roadmapChart = new Chart(ctx, {
          type: "line",
          data: { labels: labels, datasets: [dataset] },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: true,
                mode: "index",
                intersect: false,
                callbacks: {
                  label: function (context) {
                    const index = context.dataIndex;
                    if (index === 0) return "🚀 Project Start: 0%";
                    const task = sortedTasks[index - 1];
                    if (!task) return "";

                    // Get actual progress from graph data
                    let taskProgress = Math.round(taskProgressValues[index]);

                    // For Upcoming tasks, show 0%
                    if (task.status === "Upcoming") {
                      taskProgress = 0;
                    }
                    // For Complete and Ongoing tasks, show actual cumulative progress

                    const statusIcon =
                      task.status === "Complete"
                        ? "✅"
                        : task.status === "Ongoing"
                          ? "⚡"
                          : "⏳";
                    return [
                      `📋 ${task.title}`,
                      `📊 Progress: ${taskProgress}%`,
                      `📅 Deadline: ${formatDate(task.deadline) || "N/A"}`,
                      `🏷️ Status: ${statusIcon} ${task.status}`,
                    ];
                  },
                },
              },
            },
            scales: {
              y: {
                min: 0,
                max: 100,
                title: {
                  display: true,
                  text: "Completion %",
                  font: { size: 10, weight: "bold" },
                },
                ticks: {
                  stepSize: 20,
                  callback: (value) => Math.round(value) + "%",
                  font: { size: 9 },
                },
                grid: { color: "#e2e8f0" },
              },
              x: {
                grid: { display: false },
                ticks: {
                  font: { size: 9, weight: "bold" },
                  maxRotation: 35,
                  minRotation: 30,
                },
              },
            },
          },
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadCurrentUser();
        await loadProjectsFromDB();
        setTimeout(() => {
          document.getElementById("main-content").classList.add("ready");
        }, 300);
      });
    </script>
  </body>
