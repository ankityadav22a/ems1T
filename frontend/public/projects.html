<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Projects - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .modal-scroll {
        max-height: 85vh;
        overflow-y: auto;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <main id="main-content" class="md:ml-56 mt-20 p-8">
      <div class="flex justify-between items-end mb-8">
        <div>
          <p class="text-gray-500 text-sm">Welcome back,</p>
          <h1 class="text-3xl font-black text-slate-800">Projects</h1>
        </div>
        <div class="flex items-center gap-4">
          <div
            class="hidden sm:block text-sm bg-blue-50 text-blue-700 px-4 py-2 rounded-full border border-blue-100 font-bold"
          >
            Portfolio Spend: $<span id="portfolioCost">0</span>
          </div>
          <button
            onclick="toggleCreateModal()"
            class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 shadow-lg"
          >
            + Create Project
          </button>
        </div>
      </div>

      <div
        class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8"
        id="projectGrid"
      ></div>
    </main>

    <div
      id="createProjectModal"
      class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[70] p-4 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl relative overflow-hidden flex flex-col"
        style="max-height: 90vh"
      >
        <div class="h-2 bg-emerald-500 w-full shrink-0"></div>

        <div class="p-8 pb-4 shrink-0 relative">
          <button
            onclick="toggleCreateModal()"
            class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 text-2xl"
          >
            ✖
          </button>
          <h2 id="createModalTitle" class="text-2xl font-black text-slate-800">
            Initiate New Project
          </h2>
        </div>

        <div class="p-8 pt-0 overflow-y-auto flex-grow space-y-6">
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Project Name</label
                >
                <input
                  id="newProjName"
                  type="text"
                  class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                />
              </div>

              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Priority Level</label
                >
                <select
                  id="newProjPriority"
                  class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none"
                >
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>
              <!-- ── NEW: Start Date + Deadline Date (calendar inputs) ── -->
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >start date</label
                >
                <input
                  id="newProjStart"
                  type="date"
                  placeholder="Select start date"
                  class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Deadline</label
                >
                <input
                  id="newProjDeadline"
                  type="date"
                  placeholder="Select deadline"
                  class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Resources</label
                >
                <input
                  id="newProjResources"
                  type="text"
                  placeholder="e.g. React, Node.js, AWS"
                  class="w-full border p-2.5 rounded-xl bg-slate-50 outline-none focus:ring-2 ring-blue-500"
                />
              </div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="col-span-2">
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Short Description</label
                >
                <input
                  id="newProjDesc"
                  type="text"
                  placeholder="Brief overview..."
                  class="w-full border p-2.5 rounded-xl bg-slate-50"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase mb-1"
                  >Budget ($)</label
                >
                <input
                  id="newProjBudget"
                  type="number"
                  placeholder="0"
                  class="w-full border p-2.5 rounded-xl bg-slate-50"
                />
              </div>
            </div>

            <div class="border-t border-slate-100 pt-4">
              <div class="flex justify-between items-center mb-2">
                <label
                  class="block text-[10px] font-bold text-blue-600 uppercase"
                  >Task Matrix</label
                >
                <button
                  onclick="addTaskRow()"
                  class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200"
                >
                  + Add Task
                </button>
              </div>
              <div id="taskInputsContainer" class="space-y-2">
                <div class="task-row flex gap-2">
                  <input
                    type="text"
                    placeholder="Task Name"
                    class="flex-grow border p-2 rounded-lg bg-slate-50 text-xs t-name"
                  />
                  <input
                    type="date"
                    class="w-32 border p-2 rounded-lg bg-slate-50 text-xs t-date"
                  />
                  <select
                    class="w-28 border p-2 rounded-lg bg-slate-50 text-xs t-status"
                  >
                    <option value="Upcoming">Upcoming</option>
                    <option value="Ongoing">Ongoing</option>
                    <option value="Complete">Complete</option>
                  </select>
                  <button
                    onclick="this.parentElement.remove()"
                    class="text-rose-500 hover:bg-rose-50 px-2 rounded-lg"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
              <div class="flex justify-between items-center mb-3">
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase"
                  >Team Members</label
                >
                <button
                  onclick="addEmpRow()"
                  class="text-[10px] bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold hover:bg-slate-300"
                >
                  + Add Staff
                </button>
              </div>
              <div id="empInputsContainer" class="space-y-2">
                <div class="emp-row flex gap-2">
                  <input
                    type="text"
                    placeholder="Name"
                    class="flex-grow border p-2 rounded-lg bg-white text-xs e-name"
                  />
                  <input
                    type="text"
                    placeholder="ID"
                    class="w-20 border p-2 rounded-lg bg-white text-xs e-id"
                  />
                  <input
                    type="text"
                    placeholder="Role"
                    class="w-28 border p-2 rounded-lg bg-white text-xs e-pos"
                  />
                  <button
                    onclick="this.parentElement.remove()"
                    class="text-slate-400 hover:text-rose-500 px-1"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="p-8 pt-4 border-t border-slate-100 bg-white shrink-0">
          <button
            id="submitProjectBtn"
            onclick="addNewProject()"
            class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-slate-800 transition-all shadow-lg"
          >
            Create Project
          </button>
        </div>
      </div>
    </div>

    <div
      id="projectModal"
      class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl modal-scroll relative overflow-hidden"
      >
        <div class="h-2 bg-blue-600 w-full"></div>
        <button
          onclick="closeModal()"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 text-2xl transition-colors"
        >
          ✖
        </button>

        <div class="p-8">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-7">
              <div class="flex items-center gap-3 mb-2">
                <span
                  id="modalStatusBadge"
                  class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider"
                ></span>
                <h2
                  id="modalTitle"
                  class="text-3xl font-black text-slate-900"
                ></h2>
                <button
                  onclick="editProject()"
                  class="ml-auto bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-1.5 rounded-lg text-xs font-bold transition-all"
                >
                  Edit Project
                </button>
              </div>
              <p
                id="modalDuration"
                class="text-blue-600 font-bold text-sm mb-6"
              ></p>

              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4"
              >
                Roadmap & Timeline
              </h3>
              <div
                class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-6"
                style="height: 250px"
              >
                <canvas id="roadmapChart"></canvas>
              </div>

              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2"
              >
                Project Brief
              </h3>
              <p id="modalDesc" class="text-slate-600 leading-relaxed mb-6"></p>

              <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Budget</span
                  >
                  <span
                    id="modalBudget"
                    class="text-lg font-black text-slate-800"
                  ></span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Staffing</span
                  >
                  <span
                    id="modalEmpReq"
                    class="text-lg font-black text-slate-800"
                  ></span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl">
                  <span
                    class="block text-[10px] text-slate-400 font-bold uppercase"
                    >Completion</span
                  >
                  <span
                    id="modalProgressText"
                    class="text-lg font-black text-blue-600"
                  ></span>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
              <div>
                <h3
                  class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"
                >
                  Resource Stack
                </h3>
                <p
                  id="modalResources"
                  class="text-sm bg-slate-800 text-slate-200 p-3 rounded-lg font-mono"
                ></p>
              </div>

              <div>
                <h3
                  class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"
                >
                  Task Matrix
                </h3>
                <div id="modalTasks" class="space-y-2"></div>
              </div>

              <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="font-bold text-slate-800">Expense Ledger</h3>
                  <button
                    onclick="showBillPopup()"
                    class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-blue-700 transition"
                  >
                    + Add Bill
                  </button>
                </div>
                <div class="max-h-40 overflow-y-auto mb-4">
                  <table class="w-full text-xs">
                    <tbody id="modalBillsList"></tbody>
                  </table>
                </div>
                <div
                  class="flex justify-between items-center pt-3 border-t border-slate-200"
                >
                  <span class="text-xs font-bold text-slate-400 uppercase"
                    >Total Utilization</span
                  >
                  <span
                    id="modalTotalSpent"
                    class="text-xl font-black text-red-600"
                  ></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="billPopup"
      class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-[100] p-4"
    >
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
        <h3 class="text-xl font-black mb-6 text-slate-800">Register Expense</h3>
        <input
          id="billName"
          type="text"
          placeholder="Description"
          class="w-full border p-3 mb-4 rounded-xl bg-slate-50"
        />
        <input
          id="billAmount"
          type="number"
          placeholder="Cost (USD)"
          class="w-full border p-3 mb-6 rounded-xl bg-slate-50"
        />
        <div class="flex gap-3">
          <button
            onclick="submitBill()"
            class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold"
          >
            Post Bill
          </button>
          <button
            onclick="hideBillPopup()"
            class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>

    <script>
      let activeProjectName = null;
      let roadmapChart = null;
      let isEditing = false;

      const projects = [
        {
          name: "Website Redesign",
          status: "Ongoing",
          priority: "High",
          budget: 15000,
          progress: 50,
          start: "2026-02-10",
          deadline: "2026-05-15",
          description:
            "Overhauling the primary corporate portal with a headless CMS and modern UI components.",

          resources: "React, Tailwind, Strapi, AWS S3",
          employees: ["John D.", "Sarah L.", "Sonam"],
          tasks: [
            {
              title: "Design Sprint",
              status: "Complete",
              deadline: "2026-02-15",
            },
            {
              title: "Frontend Build",
              status: "Ongoing",
              deadline: "2026-03-30",
            },
            {
              title: "API Linkage",
              status: "Upcoming",
              deadline: "2026-05-15",
            },
          ],
          bills: [
            { desc: "Stock Photos", cost: 150 },
            { desc: "Domain Renewal", cost: 50 },
          ],
        },
        {
          name: "Inventory System",
          status: "Upcoming",
          priority: "Medium",
          budget: 25000,
          start: "2026-06-01",
          deadline: "2026-10-30",
          description:
            "Real-time stock tracking application with QR code integration for the warehouse.",
          resources: "Node.js, MongoDB, Zebra Scanner SDK",
          employees: ["Mike R."],
          tasks: [
            { title: "DB Schema", status: "Ongoing", deadline: "2026-07-01" },
            {
              title: "Hardware Test",
              status: "Upcoming",
              deadline: "2026-10-30",
            },
          ],
          bills: [],
        },
      ];

      function calculateProgress(tasks) {
        if (!tasks || tasks.length === 0) return 0;
        const total = tasks.length;
        const completed = tasks.filter((t) => t.status === "Complete").length;
        return Math.round((100 / total) * completed);
      }

      function renderProjects() {
        const grid = document.getElementById("projectGrid");
        let totalPortfolioSpent = 0;
        grid.innerHTML = projects
          .map((p) => {
            const progress = calculateProgress(p.tasks);

            const spent = p.bills.reduce((acc, curr) => acc + curr.cost, 0);
            totalPortfolioSpent += spent;
            const statusTheme = {
              Ongoing: "bg-amber-100 text-amber-700",
              Upcoming: "bg-blue-100 text-blue-700",
              Complete: "bg-emerald-100 text-emerald-700",
              Halted: "bg-rose-100 text-rose-700",
            }[p.status];
            return `
            <div onclick="openProject('${p.name}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl hover:scale-[1.02] transition-all cursor-pointer group">
              <div class="flex justify-between items-start mb-6">
                <div class="${statusTheme} px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-tighter">${p.status}</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">#${p.priority} Priority</div>
              </div>
              <h3 class="text-xl font-black text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">${p.name}</h3>
              <p class="text-xs text-slate-400 mb-6 line-clamp-2">${p.description}</p>
              <div class="space-y-4 mb-6">
                <div class="flex justify-between text-[11px] font-bold uppercase tracking-widest text-slate-500">
                    <span>Utilization</span>
                    <span class="text-slate-800">$${spent} <span class="text-slate-300">/ $${p.budget}</span></span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-blue-600 h-full transition-all duration-700" style="width:${progress}%"></div>
                </div>
              </div>
              <div class="flex justify-between items-center border-t border-slate-50 pt-4">
                 <div class="flex -space-x-2">
                    ${p.employees.map((e) => `<div class="w-7 h-7 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-[10px] font-bold">${e[0]}</div>`).join("")}
                 </div>
                 <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${progress}% Ready</span>
              </div>
            </div>`;
          })
          .join("");
        document.getElementById("portfolioCost").innerText =
          totalPortfolioSpent.toLocaleString();
      }

      function toggleCreateModal() {
        const modal = document.getElementById("createProjectModal");
        isEditing = false;
        document.getElementById("createModalTitle").innerText =
          "Initiate New Project";
        document.getElementById("submitProjectBtn").innerText =
          "Create Project";
        document.getElementById("newProjName").disabled = false;
        modal.classList.toggle("hidden");
        modal.classList.toggle("flex");
      }

      function addTaskRow(data = null) {
        const container = document.getElementById("taskInputsContainer");
        const div = document.createElement("div");
        div.className = "task-row flex gap-2";
        div.innerHTML = `
          <input type="text" placeholder="Task Name" class="flex-grow border p-2 rounded-lg bg-slate-50 text-xs t-name" value="${data ? data.title : ""}">
          <input type="date" class="w-32 border p-2 rounded-lg bg-slate-50 text-xs t-date" value="${data ? data.deadline : ""}">
          <select class="w-28 border p-2 rounded-lg bg-slate-50 text-xs t-status">
            <option value="Upcoming" ${data?.status === "Upcoming" ? "selected" : ""}>Upcoming</option>
            <option value="Ongoing" ${data?.status === "Ongoing" ? "selected" : ""}>Ongoing</option>
            <option value="Complete" ${data?.status === "Complete" ? "selected" : ""}>Complete</option>
          </select>
          <button onclick="this.parentElement.remove()" class="text-rose-500 hover:bg-rose-50 px-2 rounded-lg">✕</button>
        `;
        container.appendChild(div);
      }

      function addEmpRow(data = null) {
        const container = document.getElementById("empInputsContainer");
        const div = document.createElement("div");
        div.className = "emp-row flex gap-2";
        div.innerHTML = `
            <input type="text" placeholder="Name" class="flex-grow border p-2 rounded-lg bg-white text-xs e-name" value="${data ? data : ""}" />
            <input type="text" placeholder="ID" class="w-20 border p-2 rounded-lg bg-white text-xs e-id" />
            <input type="text" placeholder="Role" class="w-28 border p-2 rounded-lg bg-white text-xs e-pos" />
            <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-rose-500 px-1">✕</button>
          `;
        container.appendChild(div);
      }

      function addNewProject() {
        const name = document.getElementById("newProjName").value;
        const priority = document.getElementById("newProjPriority").value;
        const desc = document.getElementById("newProjDesc").value;
        const budget =
          parseInt(document.getElementById("newProjBudget").value) || 0;

        // ✅ NEW VALUES
        const startDate = document.getElementById("newProjStart").value;
        const deadlineDate = document.getElementById("newProjDeadline").value;
        const resourcesInput =
          document.getElementById("newProjResources").value;

        const taskRows = document.querySelectorAll(".task-row");
        const tasks = Array.from(taskRows)
          .map((row) => ({
            title: row.querySelector(".t-name").value || "Unnamed Task",
            deadline: row.querySelector(".t-date").value || "TBD",
            status: row.querySelector(".t-status").value,
          }))
          .filter((t) => t.title !== "Unnamed Task");

        const empRows = document.querySelectorAll(".emp-row");
        const employeeNames = Array.from(empRows)
          .map((row) => row.querySelector(".e-name").value)
          .filter((n) => n);

        if (!name) {
          alert("Project name is required!");
          return;
        }

        const calculatedProgress = calculateProgress(tasks);

        const projectData = {
          name: name,
          status: tasks.every((t) => t.status === "Complete")
            ? "Complete"
            : tasks.some((t) => t.status === "Ongoing")
              ? "Ongoing"
              : "Upcoming",
          priority: priority,
          progress: calculatedProgress,
          budget: budget,

          // ✅ UPDATED
          start: startDate || new Date().toISOString().split("T")[0],
          deadline:
            deadlineDate ||
            (tasks.length > 0 ? tasks[tasks.length - 1].deadline : "TBD"),

          description: desc,
          empRequired: employeeNames.length || 1,

          // ✅ UPDATED
          resources: resourcesInput || "Not Specified",

          employees: employeeNames.length > 0 ? employeeNames : ["Staff"],
          tasks:
            tasks.length > 0
              ? tasks
              : [{ title: "Initiation", status: "Upcoming", deadline: "TBD" }],
        };

        const existingIndex = projects.findIndex((p) => p.name === name);

        if (existingIndex > -1) {
          projectData.bills = projects[existingIndex].bills;
          projects[existingIndex] = projectData;
        } else {
          projectData.bills = [];
          projects.push(projectData);
        }

        renderProjects();
        toggleCreateModal();

        // ✅ CLEAR ALL FIELDS
        document.getElementById("newProjName").value = "";
        document.getElementById("newProjDesc").value = "";
        document.getElementById("newProjBudget").value = "";
        document.getElementById("newProjStart").value = "";
        document.getElementById("newProjDeadline").value = "";
        document.getElementById("newProjResources").value = "";

        document.getElementById("taskInputsContainer").innerHTML = "";
        document.getElementById("empInputsContainer").innerHTML = "";
        addTaskRow();
        addEmpRow();
      }
      //calculate progress based on tasks and update project status accordingly
      function getEffectiveProgress(tasks) {
        const sorted = [...tasks].sort((a, b) => {
          const order = { Complete: 1, Ongoing: 2, Upcoming: 3 };
          return order[a.status] - order[b.status];
        });

        const step = 100 / sorted.length;
        let progress = 0;

        for (let t of sorted) {
          if (t.status === "Complete") {
            progress += step;
          } else if (t.status === "Ongoing") {
            progress += step / 2;
          } else {
            break; // 🔥 STOP at first Upcoming
          }
        }

        return Math.round(progress);
      }

      function editProject() {
        const p = projects.find((proj) => proj.name === activeProjectName);
        if (!p) return;

        closeModal();
        toggleCreateModal();

        isEditing = true;
        document.getElementById("createModalTitle").innerText = "Edit Project";
        document.getElementById("submitProjectBtn").innerText = "Save Changes";

        document.getElementById("newProjName").value = p.name;
        document.getElementById("newProjName").disabled = true; // Key identifier
        document.getElementById("newProjPriority").value = p.priority;
        document.getElementById("newProjDesc").value = p.description;
        document.getElementById("newProjBudget").value = p.budget;
        document.getElementById("newProjStart").value = p.start;
        document.getElementById("newProjDeadline").value = p.deadline;
        document.getElementById("newProjResources").value = p.resources;

        document.getElementById("taskInputsContainer").innerHTML = "";
        p.tasks.forEach((t) => addTaskRow(t));

        document.getElementById("empInputsContainer").innerHTML = "";
        p.employees.forEach((e) => addEmpRow(e));
      }

      function openProject(name) {
        activeProjectName = name;
        const p = projects.find((proj) => proj.name === name);
        const badge = document.getElementById("modalStatusBadge");
        badge.innerText = p.status;
        badge.className = `px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${p.status === "Ongoing" ? "bg-amber-100 text-amber-700" : p.status === "Complete" ? "bg-emerald-100 text-emerald-700" : "bg-blue-100 text-blue-700"}`;
        document.getElementById("modalTitle").innerText = p.name;
        document.getElementById("modalDuration").innerText =
          `${p.start} — ${p.deadline}`;
        document.getElementById("modalDesc").innerText = p.description;
        document.getElementById("modalEmpReq").innerText =
          `${p.employees.length} Staff`;
        document.getElementById("modalBudget").innerText =
          `$${p.budget.toLocaleString()}`;
        document.getElementById("modalResources").innerText = p.resources;
        const EffectiveProgress = calculateProgress(p.tasks);
        document.getElementById("modalProgressText").innerText =
          `${EffectiveProgress}%`;
        document.getElementById("modalTasks").innerHTML = p.tasks
          .map(
            (t) =>
              `<div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100"><span class="text-sm font-bold text-slate-700">${t.title}</span><span class="text-[10px] font-black uppercase px-2 py-1 rounded ${t.status === "Complete" ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${t.status}</span></div>`,
          )
          .join("");
        const spent = p.bills.reduce((acc, curr) => acc + curr.cost, 0);
        document.getElementById("modalBillsList").innerHTML = p.bills
          .map(
            (b) =>
              `<tr class="border-b border-slate-50"><td class="py-2 text-slate-600">${b.desc}</td><td class="py-2 text-right font-bold text-slate-800">$${b.cost}</td></tr>`,
          )
          .join("");
        document.getElementById("modalTotalSpent").innerText =
          `$${spent.toLocaleString()}`;
        initChart(p);
        document
          .getElementById("projectModal")
          .classList.replace("hidden", "flex");
      }

      function initChart(project) {
        const ctx = document.getElementById("roadmapChart").getContext("2d");
        if (roadmapChart) roadmapChart.destroy();

        const sortedTasks = [...project.tasks].sort((a, b) => {
          const order = { Complete: 1, Ongoing: 2, Upcoming: 3 };
          return order[a.status] - order[b.status];
        });

        // ✅  2. Labels
        const labels = ["Start", ...sortedTasks.map((t) => t.title)];

        // ✅ 3. ADD YOUR NEW LOGIC HERE (REPLACE OLD dataValues)
        const step = 100 / sortedTasks.length;
        let cumulative = 0;

        const dataValues = [
          0,
          ...sortedTasks.map((t) => {
            if (t.status === "Complete") {
              cumulative += step;
            } else if (t.status === "Ongoing") {
              cumulative += step / 2;
            }
            return cumulative;
          }),
        ];

        roadmapChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                data: dataValues,
                borderWidth: 5,
                fill: false,
                tension: 0.4,
                pointRadius: 6,
                pointHoverRadius: 8,
                pointBackgroundColor: "#fff",
                pointBorderWidth: 3,

                // 🎨 Gradient Line
                borderColor: (context) => {
                  const chart = context.chart;
                  const { ctx, chartArea } = chart;

                  if (!chartArea) return "#0ea5e9"; // fallback

                  const gradient = ctx.createLinearGradient(
                    chartArea.left,
                    0,
                    chartArea.right,
                    0,
                  );

                  gradient.addColorStop(0, "#10b981"); // green
                  gradient.addColorStop(0.5, "#0ea5e9"); // blue
                  gradient.addColorStop(1, "#ef4444"); // red

                  return gradient;
                },

                // keep your segment logic if you want sharper transitions
                segment: {
                  borderColor: (ctx) => {
                    const idx = ctx.p1DataIndex;
                    if (idx === 0) return "#10b981";

                    const task = sortedTasks[idx - 1];
                    const prevTask = idx > 1 ? sortedTasks[idx - 2] : null;

                    if (
                      task.status === "Complete" &&
                      (!prevTask || prevTask.status === "Complete")
                    ) {
                      return "#10b981";
                    }

                    if (
                      task.status === "Ongoing" &&
                      (!prevTask ||
                        prevTask.status === "Complete" ||
                        prevTask.status === "Ongoing")
                    ) {
                      return "#0ea5e9";
                    }

                    return "#ef4444";
                  },
                },
              },
            ],
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,

            animation: {
              duration: 1200,
              easing: "easeOutQuart",
            },
            interaction: {
              mode: "nearest",
              intersect: false,
            },

            animation: {
              duration: 50,
              easing: "easeOutQuart",
            },
            animations: {
              x: {
                type: "number",
                easing: "easeOutQuart",
                duration: 1000,
                from: NaN, // start from nothing
                delay: (ctx) => ctx.index * 150, // 👉 key: left → right drawing
              },
              y: {
                type: "number",
                easing: "easeOutQuart",
                duration: 1200,
                from: 0,
                delay: (ctx) => ctx.index * 150,
              },
            },

            // ✅ 4. TOOLTIP (Hover Info)
            plugins: {
              legend: { display: false },

              tooltip: {
                enabled: true,
                mode: "index",
                intersect: false,

                callbacks: {
                  label: function (context) {
                    const index = context.dataIndex - 1;

                    if (index < 0) return "Project Start";

                    const currentTask = sortedTasks[index];
                    const nextTask = sortedTasks[index + 1];

                    let value =
                      currentTask.status === "Upcoming" ? 0 : context.raw;

                    return [
                      `Current: ${currentTask.title}`,
                      `Progress: ${value}%`,
                      `Deadline: ${currentTask.deadline || "N/A"}`,
                    ];
                  },
                },
              },
            },

            // ✅ 5. AXES
            scales: {
              y: {
                min: 0,
                max: 100,
                ticks: {
                  stepSize: 100 / sortedTasks.length,
                  callback: (value) => Math.round(value) + "%",
                  font: { size: 10, weight: "bold" },
                },
                grid: { color: "#f1f5f9" },
              },
              x: {
                grid: { display: false },
                ticks: {
                  font: { size: 10, weight: "bold" },
                },
              },
            },
          },
        });
      }

      function showBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("hidden", "flex");
      }
      function hideBillPopup() {
        document
          .getElementById("billPopup")
          .classList.replace("flex", "hidden");
      }
      function closeModal() {
        document
          .getElementById("projectModal")
          .classList.replace("flex", "hidden");
      }

      function submitBill() {
        const desc = document.getElementById("billName").value;
        const cost = parseFloat(document.getElementById("billAmount").value);
        if (desc && cost) {
          const p = projects.find((proj) => proj.name === activeProjectName);
          p.bills.push({ desc, cost });
          renderProjects();
          openProject(activeProjectName);
          hideBillPopup();
          document.getElementById("billName").value = "";
          document.getElementById("billAmount").value = "";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          renderProjects();
          document.getElementById("main-content").classList.add("ready");
        }, 400);
      });
    </script>
  </body>
