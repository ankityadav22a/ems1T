<header
  class="fixed top-0 left-0 w-full md:w-56 bg-blue-900 text-white p-4 flex justify-between items-center z-50 shadow h-16"
>
  <div class="flex items-center gap-3">
    <img src="./EMSlogo.jpg" class="h-10" alt="Logo" />
  </div>
  <button
    onclick="toggleSidebar()"
    class="md:hidden text-2xl focus:outline-none p-2 hover:bg-blue-800 rounded"
  >
    ☰
  </button>
</header>

<div
  id="sidebar"
  class="fixed top-16 left-0 h-[calc(100%-4rem)] w-56 bg-black text-white p-5 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40 overflow-y-auto"
>
  <h2 class="text-xl font-bold mb-6 border-b border-gray-700 pb-2">Menu</h2>
  <ul id="sidebarMenu" class="flex flex-col gap-3 text-sm">
    <!-- Loading skeleton -->
    <li>
      <div class="px-4 py-2 bg-gray-800 rounded animate-pulse h-10"></div>
    </li>
    <li>
      <div class="px-4 py-2 bg-gray-800 rounded animate-pulse h-10"></div>
    </li>
    <li>
      <div class="px-4 py-2 bg-gray-800 rounded animate-pulse h-10"></div>
    </li>
  </ul>
</div>

<div
  id="overlay"
  class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden"
  onclick="toggleSidebar()"
></div>
