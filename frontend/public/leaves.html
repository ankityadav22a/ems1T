<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="md:ml-56 mt-20 p-4">
      <h1 class="text-3xl font-bold mb-6">Leave Management</h1>

      <button
        onclick="openLeaveModal()"
        class="mb-4 bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700"
      >
        + Apply Leave
      </button>

      <input
        id="searchBox"
        onkeyup="searchLeave()"
        placeholder="Search by ID or Name..."
        class="mb-4 w-full md:w-1/3 border p-2 rounded shadow"
      />

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Emp ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Type</th>
              <th class="p-3">From</th>
              <th class="p-3">To</th>
              <th class="p-3">Days</th>
              <th class="p-3">Status</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="leaveTable"></tbody>
        </table>
      </div>
    </div>

    <div
      id="leaveModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded shadow w-[90%] max-w-lg relative">
        <button
          onclick="closeLeaveModal()"
          class="absolute top-2 right-3 text-xl"
        >
          ✖
        </button>

        <h2 class="text-lg font-bold mb-4">Apply for Leave</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input
            id="empId"
            placeholder="Employee ID"
            class="border p-2 rounded"
          />
          <input
            id="name"
            placeholder="Employee Name"
            class="border p-2 rounded"
          />

          <select id="type" class="border p-2 rounded">
            <option>Adoption Leave</option>
            <option>Bereavement Leave</option>
            <option>Casual Leave (CL)</option>
            <option>Compensatory Off (Comp-off)</option>
            <option>Earned Leave (EL / PL / AL)</option>
            <option>Marriage / Special Leave</option>
            <option>Maternity Leave</option>
            <option>Paternity Leave</option>
            <option>Sabbatical Leave</option>
            <option>Sick Leave (SL)</option>
            <option>Other</option>
          </select>

          <input id="fromDate" type="date" class="border p-2 rounded" />
          <input id="toDate" type="date" class="border p-2 rounded" />
        </div>

        <button
          onclick="
            addLeave();
            closeLeaveModal();
          "
          class="mt-4 bg-blue-600 text-white px-5 py-2 rounded"
        >
          Submit Leave
        </button>
      </div>
    </div>

    <div
      id="historyModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded shadow w-[90%] max-w-2xl relative">
        <button onclick="closeHistory()" class="absolute top-2 right-3 text-xl">
          ✖
        </button>

        <h2 class="text-lg font-bold mb-4">Employee Leave History</h2>

        <table class="w-full border">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-2">Type</th>
              <th class="p-2">From</th>
              <th class="p-2">To</th>
              <th class="p-2">Days</th>
              <th class="p-2">Status</th>
              <th class="p-2">Action</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>

    <script src="load-layout.js"></script>

    <script>
      let leaves = JSON.parse(localStorage.getItem("leaves")) || [];

      // Helper to calculate duration
      function calculateDays(from, to) {
        if (!from || !to) return 0;
        const start = new Date(from);
        const end = new Date(to);
        const diffTime = end - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return diffDays > 0 ? diffDays : 0;
      }

      function openLeaveModal() {
        leaveModal.classList.remove("hidden");
        leaveModal.classList.add("flex");
      }

      function closeLeaveModal() {
        leaveModal.classList.add("hidden");
      }

      function closeHistory() {
        historyModal.classList.add("hidden");
      }

      function addLeave() {
        let empId = empIdInput.value.trim();
        let name = nameInput.value.trim();
        let type = typeInput.value;
        let from = fromDateInput.value;
        let to = toDateInput.value;

        if (!empId || !name || !from || !to) {
          alert("Fill all fields");
          return;
        }

        leaves.push({
          empId,
          name,
          type,
          from,
          to,
          status: "Pending",
          appliedAt: new Date().toISOString(),
        });

        localStorage.setItem("leaves", JSON.stringify(leaves));
        renderLeaves();
        clearForm();
      }

      function renderLeaves(data = leaves) {
        let map = {};
        leaves.forEach((l, index) => {
          map[l.empId] = { ...l, originalIndex: index };
        });

        let val =
          typeof searchBox !== "undefined" ? searchBox.value.toLowerCase() : "";
        let latest = Object.values(map).filter(
          (l) =>
            l.empId.toLowerCase().includes(val) ||
            l.name.toLowerCase().includes(val),
        );

        leaveTable.innerHTML = latest
          .map(
            (l) => `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${l.empId}</td>
            <td class="p-3">
              <button onclick="openHistory('${l.empId}')"
                class="text-blue-600 hover:underline font-medium">
                ${l.name}
              </button>
            </td>
            <td class="p-3">${l.type}</td>
            <td class="p-3">${l.from}</td>
            <td class="p-3">${l.to}</td>
            <td class="p-3 font-semibold">${calculateDays(l.from, l.to)}</td>
            <td class="p-3 ${
              l.status === "Approved"
                ? "text-green-600"
                : l.status === "Rejected"
                  ? "text-red-600"
                  : "text-yellow-600"
            }">${l.status}</td>
            <td class="p-3">
              <button onclick="updateStatus(${l.originalIndex}, 'Approved')"
                class="bg-green-500 text-white px-2 py-1 text-xs rounded">Approve</button>
              <button onclick="updateStatus(${l.originalIndex}, 'Rejected')"
                class="bg-red-500 text-white px-2 py-1 text-xs rounded ml-1">Reject</button>
            </td>
          </tr>
        `,
          )
          .join("");
      }

      function openHistory(empId) {
        let empLeavesWithIndex = leaves
          .map((l, index) => ({ ...l, index }))
          .filter((l) => l.empId === empId);

        let reversedHistory = empLeavesWithIndex.reverse();

        historyTable.innerHTML = reversedHistory
          .map(
            (l) => `
          <tr class="border-b">
            <td class="p-2">${l.type}</td>
            <td class="p-2">${l.from}</td>
            <td class="p-2">${l.to}</td>
            <td class="p-2">${calculateDays(l.from, l.to)}</td>
            <td class="p-2 ${
              l.status === "Approved"
                ? "text-green-600"
                : l.status === "Rejected"
                  ? "text-red-600"
                  : "text-yellow-600"
            }">${l.status}</td>
            <td class="p-2">
              <button onclick="updateStatus(${l.index}, 'Approved', '${empId}')"
                class="bg-green-500 text-white px-2 py-1 text-xs rounded">Approve</button>
              <button onclick="updateStatus(${l.index}, 'Rejected', '${empId}')"
                class="bg-red-500 text-white px-2 py-1 text-xs rounded ml-1">Reject</button>
            </td>
          </tr>
        `,
          )
          .join("");

        historyModal.classList.remove("hidden");
        historyModal.classList.add("flex");
      }

      function updateStatus(index, status, empId = null) {
        leaves[index].status = status;
        localStorage.setItem("leaves", JSON.stringify(leaves));
        renderLeaves();
        if (empId) openHistory(empId);
      }

      function searchLeave() {
        renderLeaves();
      }

      function clearForm() {
        empIdInput.value = "";
        nameInput.value = "";
        fromDateInput.value = "";
        toDateInput.value = "";
      }

      function initializePage() {
        renderLeaves();
        document.getElementById("main-content").classList.add("ready");
      }

      document.addEventListener("DOMContentLoaded", () => {
        window.empIdInput = document.getElementById("empId");
        window.nameInput = document.getElementById("name");
        window.typeInput = document.getElementById("type");
        window.fromDateInput = document.getElementById("fromDate");
        window.toDateInput = document.getElementById("toDate");
        setTimeout(initializePage, 300);
      });
    </script>
  </body>
</html>
