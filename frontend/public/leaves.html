<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      /* 🔮 Neon Ball Style */
      .ball {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
        position: relative;
        text-align: center;
        transition: transform 0.3s ease;
        animation: float 3s ease-in-out infinite;
      }

      /* Number */
      .ball span {
        font-size: 26px;
      }

      /* Label */
      .ball p {
        font-size: 12px;
        margin-top: 4px;
        opacity: 0.9;
      }

      /* Hover effect */
      .ball:hover {
        transform: scale(1.1);
      }

      /* Floating animation */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* Glow animation */
      @keyframes glow {
        0% {
          box-shadow:
            0 0 10px currentColor,
            0 0 20px currentColor;
        }
        50% {
          box-shadow:
            0 0 25px currentColor,
            0 0 50px currentColor;
        }
        100% {
          box-shadow:
            0 0 10px currentColor,
            0 0 20px currentColor;
        }
      }

      /* COLORS */
      /* 🔵 TOTAL — Soft Blue Tech */
      .ball.total {
        background: radial-gradient(circle at 30% 30%, #e0f2fe, #bae6fd);
        color: #0369a1;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        animation:
          float 3s ease-in-out infinite,
          glowSoft 3s infinite;
      }

      /* 🟢 APPROVED — Mint Green */
      .ball.approved {
        background: radial-gradient(circle at 30% 30%, #dcfce7, #bbf7d0);
        color: #166534;
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        animation:
          float 3s ease-in-out infinite,
          glowSoft 3s infinite;
      }

      /* 🟡 PENDING — Soft Amber */
      .ball.pending {
        background: radial-gradient(circle at 30% 30%, #fef9c3, #fde68a);
        color: #92400e;
        box-shadow: 0 0 20px rgba(250, 204, 21, 0.25);
        animation:
          float 3s ease-in-out infinite,
          glowSoft 3s infinite;
      }

      /* 🔴 REJECTED — Soft Rose */
      .ball.rejected {
        background: radial-gradient(circle at 30% 30%, #ffe4e6, #fecdd3);
        color: #9f1239;
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.25);
        animation:
          float 3s ease-in-out infinite,
          glowSoft 3s infinite;
      }

      /* Disable input styling */
      input:disabled {
        background-color: #f3f4f6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="md:ml-56 mt-20 p-4">
      <h1 class="text-3xl font-bold mb-6">Leave Management</h1>
      <!-- 🔢 STATS + FILTER -->
      <!-- 🔢 NEON BALL STATS + FILTER -->
      <div
        class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8"
      >
        <!-- FILTER -->
        <select
          id="timeFilter"
          onchange="updateStats()"
          class="border p-2 rounded w-full md:w-48 bg-white shadow"
        >
          <option value="all">All Time</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="year">This Year</option>
        </select>

        <!-- BALLS -->
        <div
          class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full justify-items-center"
        >
          <div class="ball total">
            <span id="totalCount">0</span>
            <p>Total</p>
          </div>

          <div class="ball approved">
            <span id="approvedCount">0</span>
            <p>Approved</p>
          </div>

          <div class="ball pending">
            <span id="pendingCount">0</span>
            <p>Pending</p>
          </div>

          <div class="ball rejected">
            <span id="rejectedCount">0</span>
            <p>Rejected</p>
          </div>
        </div>
      </div>

      <button
        onclick="openLeaveModal()"
        class="mb-4 bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 transition self-start"
      >
        + Apply Leave
      </button>

      <input
        id="searchBox"
        onkeyup="searchLeave()"
        placeholder="Search by Employee ID, Name or Authority..."
        class="mb-4 w-full md:w-1/3 border p-2 rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Emp ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Authority</th>
              <th class="p-3">Type</th>
              <th class="p-3">From</th>
              <th class="p-3">To</th>
              <th class="p-3">Days</th>
              <th class="p-3">Status</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="leaveTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Apply Leave Modal -->
    <div
      id="leaveModal"
      class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-lg shadow-xl w-[90%] max-w-lg relative">
        <button
          onclick="closeLeaveModal()"
          class="absolute top-3 right-4 text-2xl text-gray-500 hover:text-gray-700"
        >
          ✕
        </button>

        <h2 class="text-xl font-bold mb-5">Apply for Leave</h2>

        <div class="grid grid-cols-1 gap-4">
          <div>
            <input
              id="empId"
              readonly
              disabled
              placeholder="Employee ID"
              class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100 cursor-not-allowed"
            />
          </div>

          <div
            id="employeeNameDisplay"
            class="text-sm font-medium min-h-[24px]"
          ></div>

          <select
            id="leaveType"
            class="border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select Leave Type</option>
            <option>Adoption Leave</option>
            <option>Bereavement Leave</option>
            <option>Casual Leave (CL)</option>
            <option>Compensatory Off (Comp-off)</option>
            <option>Earned Leave (EL / PL / AL)</option>
            <option>Marriage / Special Leave</option>
            <option>Maternity Leave</option>
            <option>Paternity Leave</option>
            <option>Sabbatical Leave</option>
            <option>Sick Leave (SL)</option>
            <option>Other</option>
          </select>

          <div class="grid grid-cols-2 gap-4">
            <input
              id="fromDate"
              type="date"
              class="border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <input
              id="toDate"
              type="date"
              class="border p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <button
          onclick="addLeave()"
          class="mt-6 w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition font-medium"
        >
          Submit Leave Application
        </button>
      </div>
    </div>

    <!-- History Modal -->
    <div
      id="historyModal"
      class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-lg shadow-xl w-[90%] max-w-2xl relative">
        <button
          onclick="closeHistory()"
          class="absolute top-3 right-4 text-2xl text-gray-500 hover:text-gray-700"
        >
          ✕
        </button>

        <h2 class="text-xl font-bold mb-4" id="historyTitle">
          Employee Leave History
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full border">
            <thead class="bg-gray-200">
              <tr>
                <th class="p-3">Type</th>
                <th class="p-3">From</th>
                <th class="p-3">To</th>
                <th class="p-3">Days</th>
                <th class="p-3">Status</th>
                <th class="p-3">Action</th>
              </tr>
            </thead>
            <tbody id="historyTable" class="text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>

    <script>
      let leaves = [];
      let allEmployees = [];
      let currentEmployeeName = "";
      let currentUser = null;

      const authorityOrder = {
        Owner: 1,
        Admin: 2,
        Administration: 3,
        Employee: 4,
      };

      async function loadCurrentUser() {
        try {
          const res = await fetch("/api/me", { credentials: "include" });
          if (!res.ok) throw new Error("Not authenticated");
          currentUser = await res.json();
        } catch (err) {
          console.error("Failed to load user:", err);
          window.location.href = "login.html";
        }
      }

      async function loadEmployees() {
        try {
          const res = await fetch("/api/employees");
          allEmployees = await res.json();
        } catch (err) {
          console.error("Failed to load employees:", err);
        }
      }

      function canAccessEmployee(employeeAuthority, employeeId) {
        if (!currentUser) return false;

        if (currentUser.employee_id === employeeId) return true;

        const currentAuth = currentUser.authority;
        const targetAuth = employeeAuthority;

        if (currentAuth === "Owner") return true;

        if (currentAuth === "Admin") {
          return targetAuth === "Administration" || targetAuth === "Employee";
        }

        if (currentAuth === "Administration") {
          return targetAuth === "Employee";
        }

        return false;
      }

      function canTakeAction(employeeAuthority, employeeId) {
        if (!currentUser) return false;

        // User cannot take action on their own leave
        if (currentUser.employee_id === employeeId) return false;

        const currentAuth = currentUser.authority;
        const targetAuth = employeeAuthority;

        if (currentAuth === "Owner") return true;

        if (currentAuth === "Admin") {
          return targetAuth === "Administration" || targetAuth === "Employee";
        }

        if (currentAuth === "Administration") {
          return targetAuth === "Employee";
        }

        return false;
      }

      function getEmployeeAuthority(employeeId) {
        const emp = allEmployees.find((e) => e.employee_id === employeeId);
        return emp ? emp.authority : "Employee";
      }

      // Get accessible leaves based on user authority
      function getAccessibleLeaves() {
        return leaves.filter((leave) => {
          const empAuthority = getEmployeeAuthority(leave.employee_id);
          return canAccessEmployee(empAuthority, leave.employee_id);
        });
      }

      async function fetchLeaves() {
        try {
          const res = await fetch("/api/leaves");
          if (!res.ok) throw new Error("Failed to fetch");
          leaves = await res.json();
          renderLeaves();
          updateStats();
        } catch (err) {
          console.error(err);
          alert("Failed to load leaves. Check console.");
        }
      }

      function calculateDays(from, to) {
        if (!from || !to) return 0;
        let start = new Date(from);
        let end = new Date(to);
        if (end < start) return 0;

        let count = 0;
        while (start <= end) {
          if (start.getDay() !== 0) count++;
          start.setDate(start.getDate() + 1);
        }
        return count;
      }

      function formatDate(dateString) {
        const d = new Date(dateString);
        const day = String(d.getDate()).padStart(2, "0");
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
      }

      function openLeaveModal() {
        // Auto-fill Employee ID with logged-in user's ID
        const empIdInput = document.getElementById("empId");
        if (currentUser && currentUser.employee_id) {
          empIdInput.value = currentUser.employee_id;
          // Auto-fetch employee name
          fetchEmployeeNameForModal(currentUser.employee_id);
        }
        document.getElementById("leaveModal").classList.remove("hidden");
      }

      async function fetchEmployeeNameForModal(empId) {
        const nameDisplay = document.getElementById("employeeNameDisplay");

        try {
          const res = await fetch(`/api/employees/${empId}`);
          if (res.ok) {
            const employee = await res.json();
            currentEmployeeName =
              employee.employee_name || employee.name || "Employee Found";
            nameDisplay.innerHTML = `✓ Applying leave for: <strong>${currentEmployeeName}</strong>`;
            nameDisplay.className =
              "text-sm text-green-600 font-medium min-h-[24px]";
          } else {
            nameDisplay.innerHTML = "❌ Employee not found";
            nameDisplay.className =
              "text-sm text-red-600 font-medium min-h-[24px]";
          }
        } catch (err) {
          nameDisplay.innerHTML = "Error checking Employee ID";
          nameDisplay.className =
            "text-sm text-red-600 font-medium min-h-[24px]";
        }
      }

      function closeLeaveModal() {
        document.getElementById("leaveModal").classList.add("hidden");
      }

      function closeHistory() {
        document.getElementById("historyModal").classList.add("hidden");
      }

      async function fetchEmployeeName() {
        // This function is kept but not used since input is disabled
        // Keeping for compatibility
      }

      function updateStats() {
        const filter = document.getElementById("timeFilter").value;
        const now = new Date();

        const startOfWeek = new Date(now);
        const day = now.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        startOfWeek.setDate(now.getDate() + diff);
        startOfWeek.setHours(0, 0, 0, 0);

        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const startOfYear = new Date(now.getFullYear(), 0, 1);

        let startDate = null;
        if (filter === "week") startDate = startOfWeek;
        if (filter === "month") startDate = startOfMonth;
        if (filter === "year") startDate = startOfYear;

        // Get accessible leaves based on user authority
        let accessibleLeaves = getAccessibleLeaves();

        let filtered = accessibleLeaves;

        if (filter !== "all") {
          filtered = accessibleLeaves.filter((l) => {
            const from = new Date(l.from_date);
            const to = new Date(l.to_date);
            return to >= startDate && from <= now;
          });
        }

        const total = filtered.length;
        const approved = filtered.filter((l) => l.status === "Approved").length;
        const pending = filtered.filter((l) => l.status === "Pending").length;
        const rejected = filtered.filter((l) => l.status === "Rejected").length;

        document.getElementById("totalCount").textContent = total;
        document.getElementById("approvedCount").textContent = approved;
        document.getElementById("pendingCount").textContent = pending;
        document.getElementById("rejectedCount").textContent = rejected;
      }

      async function addLeave() {
        const empId = document.getElementById("empId").value.trim();
        const leaveType = document.getElementById("leaveType").value;
        const fromDate = document.getElementById("fromDate").value;
        const toDate = document.getElementById("toDate").value;

        if (!empId || !leaveType || !fromDate || !toDate) {
          alert("Please fill all fields");
          return;
        }

        try {
          const res = await fetch("/api/leaves", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              employee_id: empId,
              leave_type: leaveType,
              from_date: fromDate,
              to_date: toDate,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.error || "Failed to submit leave");
            return;
          }

          closeLeaveModal();
          clearForm();
          fetchLeaves();
        } catch (err) {
          console.error(err);
          alert("Error submitting leave");
        }
      }

      function renderLeaves() {
        // Get accessible leaves based on user authority
        let accessibleLeaves = getAccessibleLeaves();

        // Group by employee_id and keep the latest leave per employee
        const employeeLatestMap = {};
        accessibleLeaves.forEach((leave) => {
          if (!employeeLatestMap[leave.employee_id]) {
            employeeLatestMap[leave.employee_id] = leave;
          } else {
            if (
              new Date(leave.applied_at) >
              new Date(employeeLatestMap[leave.employee_id].applied_at)
            ) {
              employeeLatestMap[leave.employee_id] = leave;
            }
          }
        });

        let uniqueLeaves = Object.values(employeeLatestMap);

        // Sort: First by authority (Owner > Admin > Administration > Employee)
        // Then within same authority, show latest applied first
        uniqueLeaves.sort((a, b) => {
          const authA = getEmployeeAuthority(a.employee_id);
          const authB = getEmployeeAuthority(b.employee_id);
          const orderA = authorityOrder[authA] || 5;
          const orderB = authorityOrder[authB] || 5;

          if (orderA !== orderB) {
            return orderA - orderB;
          }

          // Same authority - show latest applied first
          return new Date(b.applied_at) - new Date(a.applied_at);
        });

        const tbody = document.getElementById("leaveTable");
        tbody.innerHTML = uniqueLeaves
          .map((l) => {
            const empAuthority = getEmployeeAuthority(l.employee_id);
            const canAction = canTakeAction(empAuthority, l.employee_id);
            const isSelf = currentUser?.employee_id === l.employee_id;

            return `
              <tr class="border-b hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition"
                  onclick="openHistory('${l.employee_id}')">
                <td class="p-3">${l.employee_id}</td>
                <td class="p-3">${l.employee_name || "N/A"}</td>
                <td class="p-3">${empAuthority}</td>
                <td class="p-3">${l.leave_type}</td>
                <td class="p-3">${formatDate(l.from_date)}</td>
                <td class="p-3">${formatDate(l.to_date)}</td>
                <td class="p-3 font-semibold">${calculateDays(l.from_date, l.to_date)}</td>
                <td class="p-3 ${
                  l.status === "Approved"
                    ? "text-green-600 font-medium"
                    : l.status === "Rejected"
                      ? "text-red-600 font-medium"
                      : "text-yellow-600"
                }">
                  ${l.status || "Pending"}
                </td>
                <td class="p-3">
                  ${
                    !isSelf && canAction
                      ? `
                    <button 
                      onclick="event.stopPropagation(); updateStatus(${l.id}, 'Approved')" 
                      class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 text-xs rounded mr-1 transition">
                      Approve
                    </button>
                    <button 
                      onclick="event.stopPropagation(); updateStatus(${l.id}, 'Rejected')" 
                      class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 text-xs rounded transition">
                      Reject
                    </button>
                  `
                      : isSelf
                        ? `<span class="text-gray-400 text-xs">No Action</span>`
                        : `<span class="text-gray-400 text-xs">No Access</span>`
                  }
                </td>
              </tr>
            `;
          })
          .join("");
      }

      function openHistory(empId) {
        const empAuthority = getEmployeeAuthority(empId);

        // Check if user can access this employee's history
        if (!canAccessEmployee(empAuthority, empId)) {
          alert(
            "❌ You don't have permission to view this employee's leave history",
          );
          return;
        }

        // Filter leaves for this employee
        let empLeaves = leaves.filter((l) => l.employee_id === empId);

        // Sort by status priority: Pending first, then Approved, then Rejected
        // And within same status, show latest first
        const statusPriority = { Pending: 1, Approved: 2, Rejected: 3 };
        empLeaves.sort((a, b) => {
          if (statusPriority[a.status] !== statusPriority[b.status]) {
            return statusPriority[a.status] - statusPriority[b.status];
          }
          return new Date(b.applied_at) - new Date(a.applied_at);
        });

        const historyTitle = document.getElementById("historyTitle");
        historyTitle.textContent = `Leave History - ${empId}`;

        const tbody = document.getElementById("historyTable");
        tbody.innerHTML = empLeaves
          .map((l) => {
            const canAction = canTakeAction(empAuthority, empId);
            const isSelf = currentUser?.employee_id === empId;

            return `
              <tr class="border-b">
                <td class="p-3">${l.leave_type}</td>
                <td class="p-3">${formatDate(l.from_date)}</td>
                <td class="p-3">${formatDate(l.to_date)}</td>
                <td class="p-3">${calculateDays(l.from_date, l.to_date)}</td>
                <td class="p-3 ${
                  l.status === "Approved"
                    ? "text-green-600"
                    : l.status === "Rejected"
                      ? "text-red-600"
                      : "text-yellow-600"
                }">${l.status || "Pending"}</td>
                <td class="p-3">
                  ${
                    !isSelf && canAction
                      ? `
                    <button onclick="updateStatus(${l.id}, 'Approved')" 
                      class="bg-green-500 text-white px-3 py-1 text-xs rounded mr-1">Approve</button>
                    <button onclick="updateStatus(${l.id}, 'Rejected')" 
                      class="bg-red-500 text-white px-3 py-1 text-xs rounded">Reject</button>
                  `
                      : isSelf
                        ? `<span class="text-gray-400 text-xs">No Action</span>`
                        : `<span class="text-gray-400 text-xs">No Access</span>`
                  }
                </td>
              </tr>
            `;
          })
          .join("");

        document.getElementById("historyModal").classList.remove("hidden");
      }

      async function updateStatus(id, status) {
        try {
          await fetch(`/api/leaves/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status }),
          });
          fetchLeaves();
        } catch (err) {
          console.error(err);
          alert("Failed to update status");
        }
      }

      function searchLeave() {
        const val = document
          .getElementById("searchBox")
          .value.toLowerCase()
          .trim();

        // Get accessible leaves based on user authority
        let accessibleLeaves = getAccessibleLeaves();

        // Group by employee and keep latest
        const employeeLatestMap = {};
        accessibleLeaves.forEach((leave) => {
          if (!employeeLatestMap[leave.employee_id]) {
            employeeLatestMap[leave.employee_id] = leave;
          } else {
            if (
              new Date(leave.applied_at) >
              new Date(employeeLatestMap[leave.employee_id].applied_at)
            ) {
              employeeLatestMap[leave.employee_id] = leave;
            }
          }
        });

        let uniqueLeaves = Object.values(employeeLatestMap);

        // Apply search filter
        let filtered = uniqueLeaves;
        if (val) {
          filtered = uniqueLeaves.filter(
            (l) =>
              (l.employee_id || "").toLowerCase().includes(val) ||
              (l.employee_name || "").toLowerCase().includes(val) ||
              (getEmployeeAuthority(l.employee_id) || "")
                .toLowerCase()
                .includes(val),
          );
        }

        // Sort by authority and then by applied date
        filtered.sort((a, b) => {
          const authA = getEmployeeAuthority(a.employee_id);
          const authB = getEmployeeAuthority(b.employee_id);
          const orderA = authorityOrder[authA] || 5;
          const orderB = authorityOrder[authB] || 5;

          if (orderA !== orderB) {
            return orderA - orderB;
          }
          return new Date(b.applied_at) - new Date(a.applied_at);
        });

        const tbody = document.getElementById("leaveTable");
        tbody.innerHTML = filtered
          .map((l) => {
            const empAuthority = getEmployeeAuthority(l.employee_id);
            const canAction = canTakeAction(empAuthority, l.employee_id);
            const isSelf = currentUser?.employee_id === l.employee_id;

            return `
              <tr class="border-b hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition"
                  onclick="openHistory('${l.employee_id}')">
                <td class="p-3">${l.employee_id}</td>
                <td class="p-3">${l.employee_name || "N/A"}</td>
                <td class="p-3">${empAuthority}</td>
                <td class="p-3">${l.leave_type}</td>
                <td class="p-3">${formatDate(l.from_date)}</td>
                <td class="p-3">${formatDate(l.to_date)}</td>
                <td class="p-3 font-semibold">${calculateDays(l.from_date, l.to_date)}</td>
                <td class="p-3 ${
                  l.status === "Approved"
                    ? "text-green-600 font-medium"
                    : l.status === "Rejected"
                      ? "text-red-600 font-medium"
                      : "text-yellow-600"
                }">
                  ${l.status || "Pending"}
                </td>
                <td class="p-3">
                  ${
                    !isSelf && canAction
                      ? `
                    <button 
                      onclick="event.stopPropagation(); updateStatus(${l.id}, 'Approved')" 
                      class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 text-xs rounded mr-1 transition">
                      Approve
                    </button>
                    <button 
                      onclick="event.stopPropagation(); updateStatus(${l.id}, 'Rejected')" 
                      class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 text-xs rounded transition">
                      Reject
                    </button>
                  `
                      : isSelf
                        ? `<span class="text-gray-400 text-xs">No Action</span>`
                        : `<span class="text-gray-400 text-xs">No Access</span>`
                  }
                </td>
              </tr>
            `;
          })
          .join("");
      }

      function clearForm() {
        document.getElementById("leaveType").value = "";
        document.getElementById("fromDate").value = "";
        document.getElementById("toDate").value = "";
        document.getElementById("employeeNameDisplay").innerHTML = "";
        currentEmployeeName = "";
      }

      async function initializePage() {
        await loadCurrentUser();
        await loadEmployees();
        await fetchLeaves();
        document.getElementById("main-content").classList.add("ready");
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initializePage, 100);
      });
    </script>
  </body>
</html>
