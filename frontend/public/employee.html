<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="md:ml-56 pt-20 p-6">
      <!-- HEADER -->
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-extrabold">Employees</h1>
          <p class="text-gray-500 text-sm">Manage workforce & assignments</p>
        </div>

        <button
          onclick="openAddModal()"
          class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 shadow"
        >
          + Add Employee
        </button>
      </div>

      <!-- SEARCH -->
      <input
        id="search"
        onkeyup="renderCards()"
        placeholder="Search employees..."
        class="mb-6 p-3 w-full max-w-md rounded-xl border focus:ring-2 focus:ring-blue-500"
      />
      <!-- salary filter  -->
      <select
        id="salaryFilter"
        onchange="renderCards()"
        class="p-3 rounded-xl border w-full md:w-auto"
      >
        <option value="">Salary Range</option>
        <option value="0-above">all</option>
        <option value="0-10000">Below ₹10,000</option>
        <option value="10000-50000">₹10,000 – ₹50,000</option>
        <option value="50000-100000">₹50,000 – ₹1Lakhs</option>
        <option value="100000-1000000">₹1 Lakh – ₹10 Lakhs</option>
        <option value="1000000-1500000">₹10 Lakhs – ₹15 Lakhs</option>
        <option value="1500000-3000000">₹15 Lakhs – ₹30 Lakhs</option>
        <option value="3000000-6000000">₹30 Lakhs – ₹60 Lakhs</option>
        <option value="6000000-10000000">₹60 Lakhs – ₹1 Crore</option>
        <option value="10000000-above">Above ₹1 Crore</option>
      </select>
      <!-- CARD GRID -->
      <div
        id="cardContainer"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <!-- MODAL -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center"
    >
      <div class="bg-white p-6 rounded-2xl w-full max-w-lg">
        <h2 id="modalTitle" class="text-xl font-bold mb-5">Add Employee</h2>

        <div class="grid grid-cols-2 gap-4">
          <input
            id="name"
            placeholder="Employee Name"
            class="border p-2 rounded col-span-2"
          />
          <input
            id="email"
            type="email"
            placeholder="Email"
            class="border p-2 rounded col-span-2"
          />
          <select
            id="department"
            class="border p-2 rounded"
            onchange="handleDeptChange()"
          >
            <option value="">Select Department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Operations">Operations</option>
            <option value="Other">Other</option>
          </select>
          <!-- Hidden input for "Other" -->
          <input
            id="otherDept"
            placeholder="Enter Department"
            class="border p-2 rounded hidden col-span-2"
          />
          <!-- <input
            id="project"
            placeholder="Project"
            class="border p-2 rounded"
          /> -->
          <input id="role" placeholder="Role" class="border p-2 rounded" />

          <select id="mode" class="border p-2 rounded">
            <option value="">Work Mode</option>
            <option>Remote</option>
            <option>Hybrid</option>
            <option>Onsite</option>
          </select>

          <input
            id="salary"
            type="number"
            placeholder="Salary"
            class="border p-2 rounded"
          />

          <input
            id="joinDate"
            type="date"
            class="border p-2 rounded col-span-2"
          />
        </div>

        <div class="flex gap-3 mt-6">
          <button
            onclick="saveEmployee()"
            class="flex-1 bg-blue-600 text-white py-2 rounded-lg"
          >
            Save
          </button>

          <button
            onclick="closeModal()"
            class="flex-1 bg-gray-200 py-2 rounded-lg"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>

    <script>
      const API = "http://localhost:3000/api/employees";
      let employees = [];
      let editId = null;
      function openAddModal() {
        editId = null; // ✅ important
        clearForm(); // ✅ clear only for new
        openModal();
      }
      function openModal() {
        document.getElementById("modal").classList.remove("hidden");
        document.getElementById("modalTitle").textContent = editId
          ? "Edit Employee"
          : "Add Employee";
      }

      function closeModal() {
        document.getElementById("modal").classList.add("hidden");
      }

      function handleDeptChange() {
        const dept = document.getElementById("department").value;
        const otherInput = document.getElementById("otherDept");

        if (dept === "Other") {
          otherInput.classList.remove("hidden");
        } else {
          otherInput.classList.add("hidden");
          otherInput.value = "";
        }
      }

      /* ✅ FETCH EMPLOYEES */
      async function fetchEmployees() {
        try {
          const res = await fetch(API);
          employees = await res.json();
          renderCards();
        } catch (err) {
          console.error(err);
        }
      }

      function renderCards() {
        const container = document.getElementById("cardContainer");
        const q = document.getElementById("search").value.toLowerCase().trim();
        const salaryRange =
          document.getElementById("salaryFilter")?.value || "";

        let filtered = employees.filter((emp) => {
          const matchesSearch =
            (emp.employee_name || "").toLowerCase().includes(q) ||
            (emp.department || "").toLowerCase().includes(q) ||
            (emp.role || "").toLowerCase().includes(q) ||
            (emp.employee_id || "").toLowerCase().includes(q);

          let matchesSalary = true;

          if (salaryRange) {
            const [min, max] = salaryRange.split("-");
            const salary = Number(emp.salary) || 0;

            if (max === "above") {
              matchesSalary = salary >= Number(min);
            } else {
              matchesSalary = salary >= Number(min) && salary <= Number(max);
            }
          }

          return matchesSearch && matchesSalary;
        });

        container.innerHTML =
          filtered.length === 0
            ? `<p class="col-span-full text-center text-gray-500 py-10">No employees found</p>`
            : filtered
                .map((emp) => {
                  const modeColor =
                    emp.work_mode === "Remote"
                      ? "bg-green-100 text-green-700"
                      : emp.work_mode === "Hybrid"
                        ? "bg-yellow-100 text-yellow-700"
                        : "bg-blue-100 text-blue-700";

                  return `
            <div class="bg-white p-6 rounded-2xl shadow hover:shadow-xl transition">

              <div class="flex justify-between mb-4">
                <span class="text-xs font-bold bg-gray-100 px-3 py-1 rounded">
                  #${emp.employee_id}
                </span>
                <span class="text-xs px-2 py-1 rounded ${modeColor}">
                  ${emp.work_mode || "N/A"}
                </span>
              </div>

              <h2 class="text-xl font-bold">${emp.employee_name}</h2>
              <p class="text-sm text-gray-500">${emp.role || "N/A"}</p>

              <div class="mt-4 text-sm text-gray-600 space-y-1">
                <p><strong>Dept:</strong> ${emp.department}</p>
                <p><strong>Salary:</strong> ₹${emp.salary}</p>
                <p><strong>Authority:</strong>
        <span class="px-2 py-1 rounded bg-purple-100 text-purple-700 text-xs">
          ${emp.authority || "Employee"}
        </span>
      </p>
              </div>

              <div class="mt-5 pt-4 border-t text-xs text-gray-500">
                Joined: ${
                  emp.join_date
                    ? new Date(emp.join_date).toLocaleDateString("en-CA")
                    : "N/A"
                }
              </div>

              <div class="mt-4 flex gap-2">
                <button onclick="editEmployee('${emp.employee_id}')"
                  class="flex-1 bg-yellow-100 text-yellow-700 py-2 rounded-lg text-sm font-semibold hover:bg-yellow-200">
                  Edit
                </button>

                <button onclick="deleteEmployee('${emp.employee_id}')"
                  class="flex-1 bg-red-100 text-red-700 py-2 rounded-lg text-sm font-semibold hover:bg-red-200">
                  Delete
                </button>
              </div>

            </div>`;
                })
                .join("");
      }

      /* ✅ SAVE (CREATE + UPDATE) */
      async function saveEmployee() {
        const name = document.getElementById("name")?.value.trim();
        const email = document.getElementById("email")?.value.trim();
        let department = document.getElementById("department").value;
        const otherDept = document.getElementById("otherDept").value.trim();

        if (department === "Other") {
          if (!otherDept) {
            alert("Please enter department name");
            return;
          }
          department = otherDept;
        }

        const role = document.getElementById("role").value.trim();
        const mode = document.getElementById("mode").value;
        const salary = document.getElementById("salary").value;
        const joinDate = document.getElementById("joinDate").value;

        if (
          !name ||
          !email ||
          !department ||
          !role ||
          !mode ||
          !salary ||
          !joinDate
        ) {
          alert("Fill all fields");
          return;
        }

        const payload = {
          employee_name: name,
          department,
          role,
          work_mode: mode,
          join_date: joinDate,
          email: email,
          password: "123456",
          address: "NA",
          salary: Number(salary),
        };

        try {
          let successMessage = "";

          if (editId) {
            const res = await fetch(`${API}/${editId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              const errorData = await res.json().catch(() => ({}));
              throw new Error(errorData.error || "Failed to update employee");
            }

            const data = await res.json();
            if (data.new_id && data.new_id !== editId) {
              editId = data.new_id;
            }

            successMessage = `Employee updated!\nID: ${data.new_id || editId}`;
          } else {
            const res = await fetch(API, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              const errorData = await res.json().catch(() => ({}));
              throw new Error(errorData.error || "Failed to create employee");
            }

            const data = await res.json();
            successMessage = "Employee Created!\nID: " + data.employee_id;
          }

          alert(successMessage);
          closeModal();
          clearForm();
          editId = null;
          await fetchEmployees();
        } catch (err) {
          console.error(err);
          alert(
            "Error: " + (err.message || "Something went wrong while saving"),
          );
        }
      }

      /* ✅ FIXED EDIT FUNCTION */
      function editEmployee(id) {
        const emp = employees.find((e) => e.employee_id === id);
        if (!emp) return;

        editId = id;
        openModal();

        document.getElementById("name").value = emp.employee_name || "";
        document.getElementById("email").value = emp.email || "";
        document.getElementById("role").value = emp.role || "";
        document.getElementById("mode").value = emp.work_mode || "";
        document.getElementById("salary").value = emp.salary || "";
        document.getElementById("joinDate").value = emp.join_date
          ? emp.join_date.split("T")[0]
          : "";

        const deptList = [
          "IT",
          "HR",
          "Sales",
          "Finance",
          "Marketing",
          "Operations",
        ];

        if (deptList.includes(emp.department)) {
          document.getElementById("department").value = emp.department;
        } else {
          document.getElementById("department").value = "Other";
          document.getElementById("otherDept").classList.remove("hidden");
          document.getElementById("otherDept").value = emp.department;
        }
      }

      /* ✅ DELETE */
      async function deleteEmployee(id) {
        if (!confirm("Delete this employee?")) return;

        try {
          await fetch(`${API}/${id}`, { method: "DELETE" });
          alert("Employee deleted");
          fetchEmployees();
        } catch (err) {
          console.error(err);
          alert("Delete failed");
        }
      }

      function clearForm() {
        document
          .querySelectorAll("#modal input")
          .forEach((i) => (i.value = ""));
        document.getElementById("mode").value = "";
      }

      /* ✅ LOAD FROM API */
      document.addEventListener("DOMContentLoaded", () => {
        fetchEmployees();
        document.getElementById("main-content").classList.add("ready");
      });
    </script>
  </body>
</html>
