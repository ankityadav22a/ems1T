<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Management | EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="md:ml-56 pt-20 p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Document Management</h1>
      </div>

      <div class="mb-6">
        <button
          onclick="openDocumentModal()"
          class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition"
        >
          + Upload Document
        </button>
      </div>

      <div class="relative mb-4">
        <input
          type="text"
          id="searchInput"
          onkeyup="searchDocument()"
          placeholder="Search by Document Name or ID..."
          class="w-full p-3 pl-10 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 outline-none"
        />
        <span class="absolute left-3 top-3.5 text-gray-400">🔍</span>
      </div>

      <div
        class="bg-white rounded shadow overflow-hidden border border-gray-200"
      >
        <table class="w-full text-left">
          <thead class="bg-gray-800 text-white">
            <tr>
              <th class="p-4">Document</th>
              <th class="p-4">Type</th>
              <th class="p-4">Employee</th>
              <th class="p-4">Action</th>
            </tr>
          </thead>
          <tbody id="documentTable" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>

    <!-- Upload Modal -->
    <div
      id="documentModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-[70]"
    >
      <div class="bg-white p-6 rounded shadow w-[90%] max-w-xl relative">
        <button
          onclick="closeDocumentModal()"
          class="absolute top-2 right-3 text-gray-500 hover:text-black text-xl"
        >
          ✖
        </button>

        <h2 class="text-lg font-semibold mb-4 text-blue-900 border-b pb-2">
          Upload New Document
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input
            id="docName"
            type="text"
            placeholder="Document Name"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />

          <div>
            <select
              id="category"
              onchange="checkOtherCategory()"
              class="border p-2 rounded w-full bg-white"
            >
              <option>New Project</option>
              <option>Ongoing Project</option>
              <option>Finished Project</option>
              <option>Office</option>
              <option>Other</option>
            </select>
            <input
              id="otherCategory"
              type="text"
              placeholder="Enter Document Type"
              class="border p-2 rounded mt-2 w-full hidden"
            />
          </div>

          <input
            id="employee"
            type="text"
            placeholder="Employee Name"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />

          <input
            id="fileUrl"
            type="url"
            placeholder="Enter file URL (cloud link)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />
        </div>

        <button
          onclick="addDocument()"
          class="mt-6 bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition w-full"
        >
          Upload Document
        </button>
      </div>
    </div>

    <!-- Duplicate Document Popup -->
    <div
      id="popupModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-[60]"
    >
      <div class="bg-white w-[90%] md:w-[400px] rounded-xl shadow-2xl p-6">
        <h2 class="text-xl font-bold text-red-600 mb-4 flex items-center gap-2">
          <span>⚠️</span> Document Already Exists
        </h2>
        <div
          id="popupContent"
          class="text-gray-700 mb-6 bg-gray-50 p-3 rounded"
        ></div>
        <button
          onclick="closePopup()"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg w-full font-bold hover:bg-blue-700"
        >
          Close
        </button>
      </div>
    </div>

    <script src="load-layout.js"></script>
    <script>
      let documents = [];

      async function fetchDocuments() {
        try {
          const res = await fetch("/api/documents");
          if (!res.ok) throw new Error("Failed to fetch");
          documents = await res.json();
          renderDocuments(documents);
        } catch (err) {
          console.error("Fetch error:", err);
          renderDocuments([]);
        }
      }

      function openDocumentModal() {
        document
          .getElementById("documentModal")
          .classList.replace("hidden", "flex");
      }

      function closeDocumentModal() {
        document
          .getElementById("documentModal")
          .classList.replace("flex", "hidden");
      }

      function checkOtherCategory() {
        const category = document.getElementById("category").value;
        const otherInput = document.getElementById("otherCategory");
        otherInput.style.display = category === "Other" ? "block" : "none";
      }

      async function addDocument() {
        const name = document.getElementById("docName").value.trim();
        const employee = document.getElementById("employee").value.trim();
        const fileUrl = document.getElementById("fileUrl").value.trim();
        let type = document.getElementById("category").value;

        if (type === "Other") {
          type = document.getElementById("otherCategory").value.trim();
        }

        if (!name || !employee || !fileUrl || !type) {
          alert("Please fill all fields");
          return;
        }

        try {
          const response = await fetch("/api/documents", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, type, employee, file: fileUrl }),
          });

          const result = await response.json();

          if (!response.ok) {
            if (result.error?.includes("exists")) {
              showPopup({ name, employee, file_url: fileUrl });
            } else {
              alert(
                "Error: " +
                  (result.error ||
                    result.details ||
                    "Failed to upload document"),
              );
            }
            return;
          }

          // Success
          closeDocumentModal();
          fetchDocuments();

          // Clear form
          document.getElementById("docName").value = "";
          document.getElementById("employee").value = "";
          document.getElementById("fileUrl").value = "";
          document.getElementById("otherCategory").value = "";

          alert("✅ Document uploaded successfully!");
        } catch (err) {
          console.error("Upload failed", err);
          alert("❌ Upload failed: " + err.message);
        }
      }

      function renderDocuments(data) {
        const tbody = document.getElementById("documentTable");
        tbody.innerHTML = data.length
          ? data
              .map(
                (d) => `
            <tr class="hover:bg-blue-50 transition">
              <td class="p-4 font-medium">${d.name}</td>
              <td class="p-4">
                <span class="bg-gray-200 px-2 py-1 rounded text-xs uppercase font-bold">${d.type}</span>
              </td>
              <td class="p-4 text-gray-600">${d.employee}</td>
              <td class="p-4 flex gap-2">
                <button onclick="openDocument('${d.file_url.replace(/'/g, "\\'")}')" 
                        class="bg-green-500 text-white px-3 py-1 rounded shadow hover:bg-green-600">Open</button>
                <button onclick="deleteDocument(${d.id})" 
                        class="bg-red-500 text-white px-3 py-1 rounded shadow hover:bg-red-600">Delete</button>
              </td>
            </tr>
          `,
              )
              .join("")
          : `<tr><td colspan="4" class="p-8 text-center text-gray-400">No documents found.</td></tr>`;
      }

      async function deleteDocument(id) {
        if (!confirm("Delete this document?")) return;

        try {
          const res = await fetch(`/api/documents/${id}`, { method: "DELETE" });
          if (!res.ok) {
            const err = await res.json();
            alert("Error: " + (err.error || "Failed to delete"));
            return;
          }
          fetchDocuments();
        } catch (err) {
          alert("Delete failed: " + err.message);
        }
      }

      function searchDocument() {
        const input = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filtered = documents.filter(
          (doc) =>
            doc.name.toLowerCase().includes(input) ||
            doc.employee.toLowerCase().includes(input),
        );
        renderDocuments(filtered);
      }

      function openDocument(url) {
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function showPopup(doc) {
        document.getElementById("popupContent").innerHTML = `
        <p><strong>Name:</strong> ${doc.name}</p>
        <p><strong>Employee:</strong> ${doc.employee}</p>
        <p class="mt-2 text-xs text-blue-600 break-all">${doc.file_url}</p>
      `;
        document
          .getElementById("popupModal")
          .classList.replace("hidden", "flex");
      }

      function closePopup() {
        document
          .getElementById("popupModal")
          .classList.replace("flex", "hidden");
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          fetchDocuments();
          document.getElementById("main-content").classList.add("ready");
        }, 300);
      });
    </script>
  </body>
</html>
