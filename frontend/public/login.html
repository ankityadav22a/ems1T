<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS • Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#6366f1",
              primaryDark: "#4f46e5",
              emsBlue: "#1e40af",
              emsLight: "#3b82f6",
            },
            animation: {
              "gradient-x": "gradient-x 16s ease infinite",
              breathe: "breathe 10s ease-in-out infinite",
              float: "float 8s ease-in-out infinite",
            },
            keyframes: {
              "gradient-x": {
                "0%, 100%": { "background-position": "0% 50%" },
                "50%": { "background-position": "100% 50%" },
              },
              breathe: {
                "0%, 100%": { transform: "scale(1)" },
                "50%": { transform: "scale(1.04)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-12px)" },
              },
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      .card-glow {
        position: relative;
        overflow: hidden;
      }
      .card-glow::before,
      .card-glow::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(99, 102, 241, 0.18),
          transparent 60%
        );
        opacity: 0;
        transition:
          opacity 0.4s ease,
          transform 0.6s ease;
        pointer-events: none;
        z-index: -1;
      }
      .card-glow::after {
        background: radial-gradient(
          circle at 70% 80%,
          rgba(59, 130, 246, 0.16),
          transparent 60%
        );
      }
      .card-glow:hover::before,
      .card-glow:hover::after {
        opacity: 1;
      }
      .card-glow.moving::before {
        transform: translate(20px, -30px) scale(1.1);
      }
      .card-glow.moving::after {
        transform: translate(-30px, 40px) scale(1.15);
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center px-4"
  >
    <div class="w-full max-w-md">
      <div
        class="card-glow bg-white rounded-2xl shadow-2xl overflow-hidden transition-all duration-500 hover:shadow-3xl"
      >
        <!-- Header -->
        <div
          class="relative h-52 overflow-hidden bg-gradient-to-br from-emsBlue via-blue-600 to-emsLight animate-gradient-x bg-[length:240%_240%]"
        >
          <div class="absolute inset-0 bg-black/15"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <div
              class="relative transform transition-all duration-700 hover:scale-110 animate-float animate-breathe"
            >
              <img
                src="EMSlogo.jpg"
                alt="EMS Logo"
                class="w-40 h-40 object-contain drop-shadow-2xl"
                onerror="
                  this.src =
                    'https://via.placeholder.com/160/1e40af/ffffff?text=EMS'
                "
              />
              <div
                class="absolute inset-0 rounded-full bg-white/10 blur-2xl scale-125 animate-pulse pointer-events-none"
              ></div>
            </div>
          </div>
          <div class="absolute bottom-6 left-0 right-0 text-center">
            <h2 class="text-xl font-bold text-white drop-shadow-lg">
              Employee Management System
            </h2>
            <p class="text-white/80 text-xs mt-1">Secure Login</p>
          </div>
        </div>

        <!-- Form -->
        <div class="p-7 pb-9">
          <form id="login-form" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5"
                >Email / Emp ID</label
              >
              <div class="relative">
                <input
                  type="text"
                  id="identifier"
                  required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/40 outline-none transition-all duration-200 shadow-sm text-sm"
                  placeholder="example@domain.com or EMP12345"
                />
                <i
                  class="fas fa-user-tie absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"
                ></i>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  required
                  class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/40 outline-none transition-all duration-200 shadow-sm text-sm"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                >
                  <i class="fas fa-eye text-sm"></i>
                </button>
              </div>
            </div>

            <button
              type="submit"
              class="w-full py-3.5 bg-gradient-to-r from-primary to-primaryDark text-white rounded-xl font-semibold shadow-md hover:shadow-lg hover:brightness-110 focus:ring-4 focus:ring-primary/30 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0"
            >
              Sign In
            </button>
          </form>

          <div class="mt-5 text-center text-xs text-gray-600">
            By signing in, you agree to our
            <button
              id="open-terms"
              class="text-primary hover:underline font-medium"
            >
              Terms & Conditions
            </button>
          </div>

          <div class="mt-6 text-center">
            <a
              href="https://mail.google.com/mail/?view=cm&fs=1&to=ankityadv22a@gmail.com"
              target="_blank"
              class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-medium shadow-md hover:shadow-lg hover:brightness-110 transition-all duration-200"
            >
              <i class="fas fa-envelope mr-2"></i> Contact Us
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Terms Modal -->
    <div
      id="terms-modal"
      class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[85vh] overflow-y-auto transform scale-95 transition-transform duration-300"
      >
        <div
          class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between z-10"
        >
          <h3 class="text-xl font-bold text-gray-800">Terms & Conditions</h3>
          <button
            id="close-terms"
            class="text-gray-500 hover:text-gray-800 text-2xl"
          >
            ×
          </button>
        </div>
        <div
          class="px-6 py-5 text-sm text-gray-700 whitespace-pre-wrap"
          id="terms-content"
        ></div>
      </div>
    </div>

    <script>
      // ==================== TERMS ====================

      // Password Toggle (Single listener)
      const toggleBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");

      toggleBtn.addEventListener("click", () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleBtn
            .querySelector("i")
            .classList.replace("fa-eye", "fa-eye-slash");
        } else {
          passwordInput.type = "password";
          toggleBtn
            .querySelector("i")
            .classList.replace("fa-eye-slash", "fa-eye");
        }
      });

      // Card glow effect
      const card = document.querySelector(".card-glow");
      if (card) {
        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          card.classList.toggle(
            "moving",
            x < 0.3 || x > 0.7 || y < 0.3 || y > 0.7,
          );
        });
        card.addEventListener("mouseleave", () =>
          card.classList.remove("moving"),
        );
      }

      // Terms Modal
      const modal = document.getElementById("terms-modal");
      const termsContent = document.getElementById("terms-content");
      const openTerms = document.getElementById("open-terms");
      const closeTerms = document.getElementById("close-terms");

      openTerms.addEventListener("click", () => {
        termsContent.textContent = termsText;
        modal.classList.remove("pointer-events-none");
        modal.classList.add("opacity-100");
        modal.querySelector("div").classList.remove("scale-95");
        modal.querySelector("div").classList.add("scale-100");
      });

      closeTerms.addEventListener("click", () => {
        modal.classList.remove("opacity-100");
        modal.classList.add("pointer-events-none");
        modal.querySelector("div").classList.remove("scale-100");
        modal.querySelector("div").classList.add("scale-95");
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeTerms.click();
      });

      // ==================== LOGIN ====================
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const identifier = document.getElementById("identifier").value.trim();
          const password = document.getElementById("password").value.trim();

          if (!identifier || !password) {
            alert("Please fill all fields");
            return;
          }

          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include", // Important for session cookie
              body: JSON.stringify({ identifier, password }),
            });

            const data = await res.json();

            if (!res.ok) {
              alert(data.error || "Login failed");
              return;
            }

            // Optional: store user info locally
            localStorage.setItem("user", JSON.stringify(data.user));

            // Redirect based on authority
            if (data.user.authority === "Employee") {
              window.location.href = "profile.html";
            } else {
              window.location.href = "index.html";
            }
          } catch (err) {
            console.error(err);
            alert("Network or server error. Please try again.");
          }
        });
    </script>
  </body>
</html>
