<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <div
      id="main-content"
      class="md:ml-56 pt-20 p-6 transition-all duration-300"
    >
      <h1 class="text-4xl font-bold text-gray-800 mb-6">Payroll Management</h1>

      <div class="flex flex-wrap gap-4 mb-6">
        <input
          id="search"
          onkeyup="searchEmp()"
          placeholder="Search..."
          class="p-2 rounded border w-full md:w-64"
        />
        <select
          onchange="filterByRange(this.value)"
          class="p-2 rounded border w-full md:w-auto"
        >
          <option value="">Salary Range</option>
          <option value="10000-50000">₹10,000 – ₹50,000</option>
          <option value="50000-100000">₹50,000 – ₹1,00,000</option>
          <option value="100000-300000">₹1 Lakh – ₹3 Lakhs</option>
          <option value="300000-700000">₹3 Lakhs – ₹7 Lakhs</option>
          <option value="700000-1500000">₹7 Lakhs – ₹15 Lakhs</option>
          <option value="1500000-3000000">₹15 Lakhs – ₹30 Lakhs</option>
          <option value="3000000-6000000">₹30 Lakhs – ₹60 Lakhs</option>
          <option value="6000000-10000000">₹60 Lakhs – ₹1 Crore</option>
          <option value="10000000-above">Above ₹1 Crore</option>
        </select>
      </div>

      <div
        id="cardContainer"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <div
          class="bg-white p-6 rounded shadow border border-gray-200 animate-pulse"
        >
          <div class="space-y-4">
            <div class="skeleton h-8 w-3/5 rounded"></div>
            <div class="skeleton h-5 w-4/5 rounded"></div>
            <div class="skeleton h-5 w-2/3 rounded"></div>
            <div class="mt-6 pt-4 border-t">
              <div class="skeleton h-10 w-full rounded"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modals -->
    <div
      id="formModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-[60] p-4"
    >
      <div class="bg-white p-6 rounded w-full max-w-md">
        <h2 class="text-lg font-bold mb-4">Add Payroll</h2>
        <input id="empId" class="hidden" />
        <div class="space-y-3">
          <div>
            <label class="text-sm">Base Salary</label
            ><input
              id="basic"
              type="number"
              class="border p-2 w-full bg-gray-100"
              placeholder="Enter base salary"
            />
          </div>
          <div>
            <label class="text-sm">Allowance</label
            ><input id="allow" type="number" class="border p-2 w-full" />
          </div>
          <div>
            <label class="text-sm">Deduction</label
            ><input id="deduct" type="number" class="border p-2 w-full" />
          </div>
          <div>
            <label class="text-sm">Bonus</label
            ><input id="bonus" type="number" class="border p-2 w-full" />
          </div>
          <div>
            <label class="text-sm">From</label
            ><input id="fromDate" type="date" class="border p-2 w-full" />
          </div>
          <div>
            <label class="text-sm">To</label
            ><input id="toDate" type="date" class="border p-2 w-full" />
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button
            onclick="closeForm()"
            class="text-gray-500 hover:text-gray-700"
          >
            Cancel
          </button>
          <button
            onclick="savePayroll()"
            class="bg-green-600 text-white px-6 py-2 rounded shadow"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <div
      id="viewModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-[60] p-4"
    >
      <div class="bg-white p-6 rounded w-full max-w-3xl overflow-x-auto">
        <h2 class="text-lg font-bold mb-4">Payroll History</h2>
        <table class="w-full text-center border min-w-[500px]">
          <thead class="bg-gray-700 text-white">
            <tr>
              <th class="p-2">Base</th>
              <th class="p-2">Allow</th>
              <th class="p-2">Deduct</th>
              <th class="p-2">Bonus</th>
              <th class="p-2">Net</th>
              <th class="p-2">Period</th>
            </tr>
          </thead>
          <tbody id="viewTable"></tbody>
        </table>
        <div class="mt-4 flex justify-end">
          <button
            onclick="closeView()"
            class="text-red-500 font-bold px-4 py-2"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>
    <script>
      let payroll = [];
      let employees = [];
      let filteredEmployees = [];
      let currentUser = null;

      const authorityOrder = {
        Owner: 1,
        Admin: 2,
        Administration: 3,
        Employee: 4,
      };

      async function loadCurrentUser() {
        try {
          const res = await fetch("/api/me", { credentials: "include" });
          if (!res.ok) throw new Error("Not authenticated");
          currentUser = await res.json();
        } catch (err) {
          console.error("Failed to load user:", err);
          window.location.href = "login.html";
        }
      }

      function canAccessEmployee(employeeAuthority, employeeId) {
        if (!currentUser) return false;
        if (currentUser.employee_id === employeeId) return true;

        const currentAuth = currentUser.authority;
        const targetAuth = employeeAuthority;

        if (currentAuth === "Owner") return true;
        if (currentAuth === "Admin") {
          return targetAuth === "Administration" || targetAuth === "Employee";
        }
        if (currentAuth === "Administration") {
          return targetAuth === "Employee";
        }
        return false;
      }

      function canAddPayroll(employeeId) {
        // Logged-in user cannot add payroll for their own card - NO ADD BUTTON for self
        if (currentUser?.employee_id === employeeId) return false;
        return true;
      }

      function getLatestPayroll(employeeId) {
        const empPayrolls = payroll
          .filter((e) => e.employee_id === employeeId)
          .sort((a, b) => new Date(b.from_date) - new Date(a.from_date));
        return empPayrolls[0];
      }

      async function loadPayroll() {
        payroll = [];
        for (let emp of employees) {
          if (!canAccessEmployee(emp.authority, emp.id)) continue;
          try {
            const res = await fetch(`/api/payroll/employee/${emp.id}`);
            const data = await res.json();
            if (Array.isArray(data)) payroll.push(...data);
          } catch (err) {
            console.error(`Failed to load payroll for ${emp.id}:`, err);
          }
        }
        renderCards();
      }

      async function loadEmployees() {
        const res = await fetch("/api/employees");
        const data = await res.json();

        employees = data.map((e) => ({
          id: e.employee_id,
          name: e.employee_name,
          dept: e.department,
          post: e.role,
          salary: e.salary,
          join_date: e.join_date,
          authority: e.authority,
        }));

        filteredEmployees = [...employees];
      }

      async function openForm(id) {
        const emp = employees.find((e) => e.id === id);
        if (!emp) return;
        if (!canAccessEmployee(emp.authority, emp.id)) {
          alert(
            "❌ You don't have permission to add payroll for this employee",
          );
          return;
        }
        if (!canAddPayroll(id)) {
          alert("❌ You cannot add payroll for your own profile");
          return;
        }

        document.getElementById("empId").value = id;
        const res = await fetch(`/api/employees/${id}`);
        const empData = await res.json();

        if (empData && empData.salary !== undefined)
          document.getElementById("basic").value = empData.salary;

        const payRes = await fetch(`/api/payroll/employee/${id}`);
        const payrolls = await payRes.json();

        let from, to;
        if (!payrolls || payrolls.length === 0) {
          from = new Date(empData.join_date);
        } else {
          const last = payrolls[0];
          from = new Date(last.to_date);
          from.setDate(from.getDate() + 1);
        }
        to = new Date(from);
        to.setMonth(to.getMonth() + 1);
        const format = (d) => d.toISOString().split("T")[0];

        document.getElementById("fromDate").value = format(from);
        document.getElementById("toDate").value = format(to);
        document.getElementById("formModal").classList.remove("hidden");
      }

      function renderCards() {
        const cardContainer = document.getElementById("cardContainer");
        const accessibleEmployees = filteredEmployees.filter((emp) =>
          canAccessEmployee(emp.authority, emp.id),
        );

        // Sort: Owner first, then Admin, then Administration, then Employee
        accessibleEmployees.sort((a, b) => {
          const orderA = authorityOrder[a.authority] || 5;
          const orderB = authorityOrder[b.authority] || 5;
          return orderA - orderB;
        });

        if (!accessibleEmployees.length) {
          cardContainer.innerHTML =
            '<div class="col-span-full text-center py-12 text-gray-500">No employees accessible with your authority level</div>';
          return;
        }

        cardContainer.innerHTML = accessibleEmployees
          .map((emp) => {
            let latest = getLatestPayroll(emp.id);
            const isSelf = currentUser?.employee_id === emp.id;
            const canAdd = canAddPayroll(emp.id);

            return `<div onclick='goToProfile("${emp.id}")' class="bg-white p-4 rounded shadow border border-gray-200 cursor-pointer hover:shadow-lg transition">
            <h2 class="text-xl font-bold">${emp.name}</h2>
            <p class="text-sm text-gray-500">ID: ${emp.id} | ${emp.dept}</p>
            <p class="text-sm text-gray-600">${emp.post}</p>
            <p class="text-xs text-gray-400 mt-1">Authority: ${emp.authority}</p>
            <div class="mt-4 p-2 bg-gray-50 rounded">
              <p class="text-sm">Base: <span class="font-semibold text-blue-700">₹${latest ? latest.base : emp.salary || 0}</span></p>
              <p class="text-lg font-bold text-green-600">Net: ₹${latest ? latest.net : 0}</p>
            </div>
            <div class="mt-4 flex gap-2">
              ${!isSelf && canAdd ? `<button onclick="event.stopPropagation(); openForm('${emp.id}')" class="flex-1 bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Add</button>` : `<div class="flex-1"></div>`}
              <button onclick="event.stopPropagation(); openView('${emp.id}')" class="flex-1 bg-gray-700 text-white px-3 py-1.5 rounded text-sm">View</button>
            </div>
          </div>`;
          })
          .join("");
      }

      function searchEmp() {
        let val = document.getElementById("search").value.toLowerCase();
        filteredEmployees = employees.filter(
          (e) =>
            e.name.toLowerCase().includes(val) ||
            e.id.toLowerCase().includes(val) ||
            e.dept.toLowerCase().includes(val),
        );
        renderCards();
      }

      function filterByRange(range) {
        if (!range) {
          filteredEmployees = [...employees];
          renderCards();
          return;
        }
        let [min, max] = range.split("-");
        min = parseInt(min);
        max = max === "above" ? Infinity : parseInt(max);
        filteredEmployees = employees.filter((emp) => {
          let latest = getLatestPayroll(emp.id);
          let net = latest ? latest.net : 0;
          return net >= min && (max === Infinity || net <= max);
        });
        renderCards();
      }

      function closeForm() {
        document.getElementById("formModal").classList.add("hidden");
      }

      async function savePayroll() {
        let id = document.getElementById("empId").value;
        const emp = employees.find((e) => e.id === id);
        if (!emp || !canAccessEmployee(emp.authority, emp.id)) {
          alert(
            "❌ You don't have permission to add payroll for this employee",
          );
          closeForm();
          return;
        }
        if (!canAddPayroll(id)) {
          alert("❌ You cannot add payroll for your own profile");
          closeForm();
          return;
        }

        const data = {
          employee_id: id,
          base: parseInt(document.getElementById("basic").value) || 0,
          allowance: parseInt(document.getElementById("allow").value) || 0,
          deduction: parseInt(document.getElementById("deduct").value) || 0,
          bonus: parseInt(document.getElementById("bonus").value) || 0,
          from_date: document.getElementById("fromDate").value,
          to_date: document.getElementById("toDate").value,
        };

        if (!data.from_date || !data.to_date) {
          alert("Please select dates");
          return;
        }

        try {
          const res = await fetch("/api/payroll", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const result = await res.json();
          if (!res.ok) {
            alert(result.error || "Failed to save payroll");
            return;
          }
          await loadPayroll();
          closeForm();
        } catch (err) {
          console.error("Save payroll error:", err);
          alert("Error saving payroll");
        }
      }

      function formatDate(dateStr) {
        if (!dateStr) return "N/A";
        const d = new Date(dateStr);
        return `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`;
      }

      async function openView(id) {
        const emp = employees.find((e) => e.id === id);
        if (!emp || !canAccessEmployee(emp.authority, emp.id)) {
          alert(
            "❌ You don't have permission to view payroll for this employee",
          );
          return;
        }
        try {
          const res = await fetch(`/api/payroll/employee/${id}`);
          const data = await res.json();
          document.getElementById("viewTable").innerHTML = data.length
            ? data
                .map(
                  (e) => `
            <tr class="border-b"><td class="p-2">₹${e.base}</td><td class="p-2">₹${e.allowance}</td><td class="p-2">₹${e.deduction}</td><td class="p-2">₹${e.bonus}</td><td class="p-2 text-green-600 font-bold">₹${e.net}</td><td class="p-2 text-xs">${formatDate(e.from_date)} to ${formatDate(e.to_date)}</td>`,
                )
                .join("")
            : `<tr><td colspan="6" class="p-4 text-gray-400 text-center">No Records Found</td>`;
          document.getElementById("viewModal").classList.remove("hidden");
        } catch (err) {
          console.error("Error loading payroll history:", err);
          alert("Error loading payroll history");
        }
      }

      function closeView() {
        document.getElementById("viewModal").classList.add("hidden");
      }

      async function initializePage() {
        await loadCurrentUser();
        await loadEmployees();
        await loadPayroll();
        document.getElementById("main-content").classList.add("ready");
        setTimeout(() => {
          const link = document.querySelector('a[href="payroll.html"]');
          if (link) {
            link.classList.add("bg-blue-700", "font-semibold");
            link.classList.remove("hover:bg-blue-600");
          }
        }, 400);
      }

      function goToProfile(id, empObj = null) {
        localStorage.setItem("profileFrom", "payroll.html");
        if (empObj)
          localStorage.setItem("selectedEmployee", JSON.stringify(empObj));
        window.location.href = `profile.html?id=${id}`;
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initializePage, 300);
      });
    </script>
  </body>
</html>
