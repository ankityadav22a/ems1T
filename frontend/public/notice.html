<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notice Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="ml-0 md:ml-56 mt-20 p-8">
      <h1 class="text-3xl font-bold mb-6">Notice / Blog Management</h1>
      <div class="mb-6">
        <button
          onclick="openNoticeModal()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium"
        >
          + Add Notice
        </button>
      </div>

      <input
        type="text"
        id="searchInput"
        onkeyup="searchNotice()"
        placeholder="Search by Title or Author..."
        class="mb-6 w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left min-w-[900px]">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-4 font-semibold">#</th>
              <th class="p-4 font-semibold">Title</th>
              <th class="p-4 font-semibold">Type</th>
              <th class="p-4 font-semibold">Author</th>
              <th class="p-4 font-semibold">Date</th>
              <th class="p-4 font-semibold">URL</th>

              <th class="p-4 font-semibold">Action</th>
            </tr>
          </thead>
          <tbody id="noticeTable">
            <tr>
              <td colspan="4" class="p-4">
                <div class="h-6 w-3/4 skeleton rounded"></div>
              </td>
            </tr>
            <tr>
              <td colspan="4" class="p-4">
                <div class="h-6 w-1/2 skeleton rounded"></div>
              </td>
            </tr>
            <tr>
              <td colspan="4" class="p-4">
                <div class="h-6 w-2/3 skeleton rounded"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div
        id="noticeModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
      >
        <div class="bg-white p-6 rounded shadow w-[90%] max-w-xl relative">
          <!-- Close Button -->
          <button
            onclick="closeNoticeModal()"
            class="absolute top-2 right-3 text-gray-500 hover:text-black text-xl"
          >
            ✖
          </button>

          <h2 class="text-xl font-bold mb-4">Add Notice</h2>

          <!-- YOUR SAME FORM (UNCHANGED) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input
              id="title"
              type="text"
              placeholder="Title"
              class="border p-2 rounded w-full"
            />
            <input
              id="author"
              type="text"
              placeholder="Author"
              class="border p-2 rounded w-full"
            />
            <select id="type" class="border p-2 rounded w-full">
              <option>Notice</option>
              <option>Blog</option>
            </select>
            <input
              id="url"
              type="url"
              placeholder="Enter Notice URL"
              class="border p-2 rounded w-full"
            />
          </div>

          <textarea
            id="content"
            placeholder="Short Description..."
            class="border p-2 rounded w-full mt-4 h-28"
          ></textarea>

          <button
            onclick="handlePostNotice(event)"
            id="postButton"
            class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium"
          >
            Post Notice
          </button>
        </div>
      </div>
    </div>

    <!-- Hover popup – FIXED version -->
    <div
      id="hoverPopup"
      class="fixed hidden z-[100] bg-white rounded-lg shadow-xl border border-gray-200 p-5 w-96 md:w-[420px] pointer-events-auto"
      onmouseenter="clearTimeout(hideTimeout)"
      onmouseleave="hideHover()"
    >
      <h2 id="hoverTitle" class="text-lg font-bold mb-1"></h2>
      <p id="hoverAuthor" class="text-sm text-gray-500 mb-3"></p>
      <div
        id="hoverContent"
        class="text-gray-700 max-h-[200px] overflow-y-auto text-sm leading-relaxed"
      ></div>
    </div>

    <div
      id="popupModal"
      class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50"
    >
      <div class="bg-white w-[90%] max-w-md rounded-lg shadow-2xl p-6">
        <h2 class="text-xl font-bold text-red-600 mb-4 flex items-center gap-2">
          ⚠️ Duplicate URL Detected
        </h2>
        <div
          id="popupContent"
          class="text-gray-700 mb-6 space-y-2 text-sm"
        ></div>
        <div class="flex gap-3">
          <button
            onclick="closePopup()"
            class="flex-1 bg-gray-500 hover:bg-gray-600 text-white px-5 py-2.5 rounded font-medium"
          >
            Cancel
          </button>
          <button
            onclick="forceAddNotice()"
            class="flex-1 bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded font-medium"
          >
            Continue Anyway
          </button>
        </div>
      </div>
    </div>

    <script src="load-layout.js"></script>
    <script>
      let currentId = 1;
      let hideTimeout = null;
      let pendingNotice = null;
      let notices = [];

      function normalizeUrl(url) {
        try {
          return url
            .trim()
            .toLowerCase()
            .replace(/^https?:\/\//, "")
            .replace(/^www\./, "")
            .replace(/\/$/, "")
            .split("#")[0]
            .split("?")[0];
        } catch {
          return url.trim().toLowerCase();
        }
      }

      function openNoticeModal() {
        document
          .getElementById("noticeModal")
          .classList.replace("hidden", "flex");
      }

      function closeNoticeModal() {
        document
          .getElementById("noticeModal")
          .classList.replace("flex", "hidden");
      }

      async function fetchNotices() {
        try {
          const res = await fetch("/api/notices");

          if (!res.ok) {
            throw new Error(`Fetch failed: ${res.status}`);
          }

          notices = await res.json();
          renderNotices(notices);
        } catch (err) {
          console.error("❌ Fetch error:", err);
          alert("Backend not reachable OR server not running.");
        }
      }

      async function handlePostNotice(e) {
        if (e) e.preventDefault();

        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim();
        const type = document.getElementById("type").value;
        const url = document.getElementById("url").value.trim();
        const content = document.getElementById("content").value.trim();

        if (!title || !author || !url) {
          alert("Please fill Title, Author, and URL.");
          return;
        }

        const normUrl = normalizeUrl(url);
        const existing = notices.find((n) => normalizeUrl(n.url) === normUrl);

        if (existing) {
          pendingNotice = { title, author, type, url, content };
          showDuplicatePopup(existing);
          return;
        }

        const btn = document.getElementById("postButton");
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Posting...";

        try {
          await saveNotice({ title, author, type, url, content });
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      async function saveNotice(data) {
        try {
          const response = await fetch("/api/notices", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          let result = {};
          try {
            result = await response.json(); // safe parse
          } catch {
            result = { error: "Invalid JSON response from server" };
          }

          if (!response.ok) {
            if (result.error && result.error.toLowerCase().includes("exists")) {
              const existing = notices.find(
                (n) => normalizeUrl(n.url) === normalizeUrl(data.url),
              );
              showDuplicatePopup(existing || data);
              return;
            }

            alert("Error: " + (result.error || "Insert failed"));
            return;
          }

          closeNoticeModal();
          clearForm();
          await fetchNotices(); // ✅ IMPORTANT await
        } catch (err) {
          console.error("❌ POST error:", err);
          alert("Server not reachable. Check backend.");
        }
      }

      function forceAddNotice() {
        if (pendingNotice) {
          saveNotice(pendingNotice);
          closePopup();
        }
      }

      function clearForm() {
        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("url").value = "";
        document.getElementById("content").value = "";
      }

      function renderNotices(data) {
        const tbody = document.getElementById("noticeTable");

        if (!data.length) {
          tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">No notices posted yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = data
          .map((n, index) => {
            const date = n.created_at
              ? new Date(n.created_at).toLocaleString()
              : "-";
            const shortContent =
              n.content?.length > 70
                ? n.content.slice(0, 70) + "..."
                : n.content || "-";

            return `
    <tr class="border-b hover:bg-gray-50">
      <td class="p-4">${index + 1}</td>
      <td class="p-4">
        <span onmouseenter="showHover(event, ${n.id})"
              onmouseleave="hideHover()"
              class="text-blue-600 cursor-pointer hover:underline">
          ${n.title}
        </span>
      </td>
      <td class="p-4">${n.type}</td>
      <td class="p-4">${n.author}</td>
      <td class="p-4">${date}</td>
      <td class="p-4">
        <a href="${n.url}" target="_blank" class="text-blue-600 underline">Link</a>
      </td>
      
      <td class="p-4 flex gap-2">
        <button onclick="openNotice('${n.url}')" class="bg-green-600 text-white px-3 py-1 rounded">Open</button>
        <button onclick="deleteNotice(${n.id})" class="bg-red-600 text-white px-3 py-1 rounded">Delete</button>
      </td>
    </tr>`;
          })
          .join("");
      }

      async function deleteNotice(id) {
        if (!confirm("Delete this notice?")) return;

        await fetch(`/api/notices/${id}`, { method: "DELETE" });
        fetchNotices();
      }

      function searchNotice() {
        const val = document.getElementById("searchInput").value.toLowerCase();

        const filtered = notices.filter(
          (n) =>
            n.title.toLowerCase().includes(val) ||
            n.author.toLowerCase().includes(val),
        );

        renderNotices(filtered);
      }

      function showHover(e, id) {
        clearTimeout(hideTimeout);

        const notice = notices.find((x) => x.id === id);
        if (!notice) return;

        document.getElementById("hoverTitle").textContent = notice.title;
        document.getElementById("hoverAuthor").textContent =
          "By " + notice.author;
        document.getElementById("hoverContent").textContent =
          notice.content || "-";

        const popup = document.getElementById("hoverPopup");

        popup.style.top = e.clientY + 15 + "px";
        popup.style.left = e.clientX + 20 + "px";
        popup.classList.remove("hidden");
      }

      function hideHover() {
        hideTimeout = setTimeout(() => {
          document.getElementById("hoverPopup").classList.add("hidden");
        }, 200);
      }

      function openNotice(url) {
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function showDuplicatePopup(existing) {
        const notice = existing || {
          title: "(unknown)",
          author: "(unknown)",
          url: "",
        };
        document.getElementById("popupContent").innerHTML = `
    <p><strong>Title:</strong> ${notice.title}</p>
    <p><strong>Author:</strong> ${notice.author}</p>
    <p class="text-blue-600">${notice.url}</p>
  `;

        document
          .getElementById("popupModal")
          .classList.replace("hidden", "flex");
      }

      function closePopup() {
        document
          .getElementById("popupModal")
          .classList.replace("flex", "hidden");
        pendingNotice = null;
      }

      function initializePage() {
        fetchNotices();
        document.getElementById("main-content").classList.add("ready");
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initializePage, 300);
      });
    </script>
  </body>
</html>
