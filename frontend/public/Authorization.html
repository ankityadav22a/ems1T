<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS - Authorization Assignment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      #main-content {
        opacity: 0;
        transition: 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      body {
        background: linear-gradient(to bottom right, #f0f4ff, #e0e7ff);
      }
      .role-admin {
        background-color: #dc2626;
        color: white;
      }
      .role-owner {
        background-color: #d97706;
        color: white;
      }
      .role-administ {
        background-color: #7c3aed;
        color: white;
      }
      .role-employee {
        background-color: #059669;
        color: white;
      }
    </style>
  </head>
  <body class="min-h-screen font-sans">
    <div id="nav-placeholder"></div>

    <!-- Header -->

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-6 py-10">
      <div
        class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <i class="fas fa-shield-alt text-3xl"></i>
          <div>
            <h1 class="text-2xl font-bold">Authorization Assignment</h1>
            <p class="text-sm opacity-90" id="login-as-info">
              Logged in as: Loading...
            </p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b">
          <h2 class="text-lg font-semibold text-gray-800">
            Employee Role Management
          </h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead
              class="bg-gray-100 text-gray-700 text-sm uppercase tracking-wider"
            >
              <tr>
                <th class="px-6 py-4">Employee</th>
                <th class="px-6 py-4">Emp ID</th>
                <th class="px-6 py-4">Current Role</th>
                <th class="px-6 py-4">Assign Role</th>
                <th class="px-6 py-4">Action</th>
              </tr>
            </thead>
            <tbody id="employee-table" class="text-gray-700">
              <!-- Rows generated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="load-layout.js"></script>
    <script>
      // ────────────────────────────────────────────────
      //  Simulated logged-in user  (you can change this)
      const loggedInUser = {
        name: "Ankit Yadav",
        empId: "EMP999",
        role: "admin", // ← change to "owner" to test limited options
        // possible values: "admin", "owner", "administration", "employee"
      };
      // ────────────────────────────────────────────────

      // Allowed roles each user type can assign
      const assignableRoles = {
        admin: ["admin", "owner", "administration", "employee"],
        owner: ["administration", "employee"],
        administration: [],
        employee: [],
      };

      const allowed = assignableRoles[loggedInUser.role] || [];

      // Show login info in header left
      document.getElementById("login-as-info").innerHTML = `
  Logged in as: <strong>${loggedInUser.name}</strong> 
  <span class="text-indigo-900">(${loggedInUser.role.charAt(0).toUpperCase() + loggedInUser.role.slice(1)})</span>
`;

      // Simulated employees
      const employees = [
        { id: "EMP001", name: "Rahul Sharma", currentRole: "employee" },
        { id: "EMP002", name: "Priya Patel", currentRole: "administration" },
        { id: "EMP003", name: "Amit Kumar", currentRole: "owner" },
        { id: "EMP004", name: "Sneha Verma", currentRole: "employee" },
        { id: "EMP005", name: "Vikram Singh", currentRole: "administration" },
        { id: "EMP006", name: "Neha Gupta", currentRole: "employee" },
      ];

      const tbody = document.getElementById("employee-table");

      // Badge styling classes
      const roleClasses = {
        admin: "role-admin",
        owner: "role-owner",
        administration: "role-administ",
        employee: "role-employee",
      };

      employees.forEach((emp) => {
        const tr = document.createElement("tr");
        tr.className = "border-t hover:bg-gray-50 transition-colors";

        const currentBadgeClass =
          roleClasses[emp.currentRole] || "bg-gray-200 text-gray-800";

        let dropdownHtml = `<span class="text-gray-500 italic text-sm">No permission</span>`;

        if (allowed.length > 0) {
          dropdownHtml = `
      <select id="role-select-${emp.id}" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white text-sm w-full max-w-[180px]">
        ${allowed
          .map(
            (role) => `
          <option value="${role}" ${role === "employee" ? "selected" : ""}>
            ${role.charAt(0).toUpperCase() + role.slice(1)}
          </option>
        `,
          )
          .join("")}
      </select>
    `;
        }

        tr.innerHTML = `
    <td class="px-6 py-4 font-medium">${emp.name}</td>
    <td class="px-6 py-4 text-gray-600">${emp.id}</td>
    <td class="px-6 py-4">
      <span class="px-3 py-1 rounded-full text-xs font-medium ${currentBadgeClass}">
        ${emp.currentRole.charAt(0).toUpperCase() + emp.currentRole.slice(1)}
      </span>
    </td>
    <td class="px-6 py-4">${dropdownHtml}</td>
    <td class="px-6 py-4">
      ${
        allowed.length > 0
          ? `
        <button 
          onclick="saveRoleChange('${emp.id}')"
          class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed transition"
          id="save-btn-${emp.id}"
          disabled
        >
          Save
        </button>
      `
          : ""
      }
    </td>
  `;

        tbody.appendChild(tr);

        // Enable save button when selection changes
        if (allowed.length > 0) {
          const select = document.getElementById(`role-select-${emp.id}`);
          const saveBtn = document.getElementById(`save-btn-${emp.id}`);

          select.addEventListener("change", () => {
            saveBtn.disabled = false;
          });
        }
      });

      // Simulated save
      window.saveRoleChange = function (empId) {
        const select = document.getElementById(`role-select-${empId}`);
        const newRole = select.value;
        if (!newRole) return;

        const btn = document.getElementById(`save-btn-${empId}`);
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';
        btn.disabled = true;

        setTimeout(() => {
          alert(
            `Role for ${empId} updated to: ${newRole.charAt(0).toUpperCase() + newRole.slice(1)}`,
          );

          // Update visible role badge
          const badge = btn.closest("tr").querySelector("td:nth-child(3) span");
          badge.textContent =
            newRole.charAt(0).toUpperCase() + newRole.slice(1);
          badge.className = `px-3 py-1 rounded-full text-xs font-medium ${roleClasses[newRole] || "bg-gray-200 text-gray-800"}`;

          btn.innerHTML = original;
          btn.disabled = true;
        }, 1200);
      };
    </script>
  </body>
</html>
