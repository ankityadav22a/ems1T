<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS - Authorization Assignment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="load-layout.js"></script>

    <style>
      body {
        background: linear-gradient(to bottom right, #f0f4ff, #e0e7ff);
      }

      #main-content {
        margin-left: 0;
        padding-top: 100px;
        opacity: 0;
        transition: opacity 0.5s ease;
        min-height: 100vh;
      }

      @media (min-width: 768px) {
        #main-content {
          margin-left: 224px;
        }
      }

      .role-admin {
        background-color: #dc2626;
        color: white;
      }
      .role-owner {
        background-color: #d97706;
        color: white;
      }
      .role-administration {
        background-color: #7c3aed;
        color: white;
      }
      .role-employee {
        background-color: #059669;
        color: white;
      }
    </style>
  </head>
  <body class="min-h-screen font-sans">
    <div id="nav-placeholder"></div>

    <div id="main-content" class="max-w-7xl mx-auto px-6 py-8">
      <div
        class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4"
      >
        <div class="flex items-center gap-4">
          <i class="fas fa-shield-alt text-3xl text-indigo-600"></i>
          <div>
            <h1 class="text-3xl font-bold text-gray-800">
              Authorization Assignment
            </h1>
            <p class="text-sm text-gray-600" id="login-as-info">
              Loading user info...
            </p>
          </div>
        </div>
        <span
          id="user-authority-badge"
          class="px-5 py-2 rounded-full text-sm font-medium"
        ></span>
      </div>

      <!-- Search Bar -->
      <div class="mb-6">
        <input
          id="searchInput"
          type="text"
          onkeyup="filterData()"
          placeholder="Search by Name, Emp ID or Authority..."
          class="w-full md:w-96 p-4 rounded-2xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>

      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- Desktop Table -->
        <div class="hidden md:block overflow-x-auto">
          <table class="w-full text-left">
            <thead
              class="bg-gray-100 text-gray-700 text-sm uppercase tracking-wider"
            >
              <tr>
                <th class="px-8 py-5">Employee Name</th>
                <th class="px-8 py-5">Emp ID</th>
                <th class="px-8 py-5">Authority</th>
                <th class="px-8 py-5">Password</th>
                <th class="px-8 py-5 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="employee-table" class="text-gray-700"></tbody>
          </table>
        </div>

        <!-- Mobile Cards -->
        <div
          id="mobile-cards"
          class="md:hidden p-4 grid grid-cols-1 gap-4"
        ></div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      id="edit-modal"
      class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4">
        <div class="px-8 py-6 border-b flex justify-between items-center">
          <h3 class="text-2xl font-semibold">Edit Employee</h3>
          <button
            onclick="closeModal()"
            class="text-3xl text-gray-400 hover:text-gray-600"
          >
            ×
          </button>
        </div>

        <div class="p-8 space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Employee Name</label
            >
            <input
              id="edit-name"
              type="text"
              class="w-full px-5 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Employee ID</label
            >
            <input
              id="edit-empid"
              type="text"
              readonly
              class="w-full px-5 py-3.5 bg-gray-100 border border-gray-300 rounded-2xl"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Authority</label
            >
            <select
              id="edit-authority"
              class="w-full px-5 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500"
            ></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Password <span class="text-red-500">(Visible)</span></label
            >
            <input
              id="edit-password"
              type="text"
              class="w-full px-5 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>

        <div class="px-8 py-6 border-t flex justify-end gap-4">
          <button
            onclick="closeModal()"
            class="px-8 py-3 text-gray-600 hover:bg-gray-100 rounded-2xl"
          >
            Cancel
          </button>
          <button
            onclick="saveEmployeeChanges()"
            class="px-8 py-3 bg-indigo-600 text-white rounded-2xl hover:bg-indigo-700"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;
      let editingId = null;
      let allEmployees = [];

      const roleClasses = {
        Admin: "role-admin",
        Owner: "role-owner",
        Administration: "role-administration",
        Employee: "role-employee",
      };

      const assignableAuthorities = {
        Owner: ["Owner", "Admin", "Administration", "Employee"],
        Admin: ["Administration", "Employee"], // Admin cannot assign Owner
        Administration: [],
        Employee: [],
      };
      const authorityPriority = {
        Owner: 1,
        Admin: 2,
        Administration: 3,
        Employee: 4,
      };

      async function init() {
        await new Promise((resolve) => {
          const check = setInterval(() => {
            if (document.getElementById("sidebar")) {
              clearInterval(check);
              resolve();
            }
          }, 50);
        });

        await loadCurrentUser();
        if (currentUser) {
          await loadEmployees();
          document.getElementById("main-content").style.opacity = "1";
        }
      }

      async function loadCurrentUser() {
        try {
          const res = await fetch("/api/me", { credentials: "include" });
          currentUser = await res.json();

          document.getElementById("login-as-info").innerHTML = `
                      Logged in as: <strong>${currentUser.employee_name || "System Administrator"}</strong>
                      <span class="text-indigo-600">(${currentUser.authority})</span>
                    `;

          const badge = document.getElementById("user-authority-badge");
          badge.textContent = currentUser.authority;
          badge.className = `px-5 py-2 rounded-full text-sm font-medium ${roleClasses[currentUser.authority] || "bg-gray-500 text-white"}`;
        } catch (err) {
          alert("Please login first!");
          window.location.href = "login.html";
        }
      }

      async function loadEmployees() {
        const tbody = document.getElementById("employee-table");
        const mobileContainer = document.getElementById("mobile-cards");

        tbody.innerHTML = `<tr><td colspan="5" class="py-16 text-center">Loading...</td></tr>`;
        mobileContainer.innerHTML = `<div class="text-center py-10 text-gray-500">Loading employees...</div>`;

        try {
          const res = await fetch("/api/employees/role-management", {
            credentials: "include",
          });
          let employees = await res.json();

          // Owner can only see non-Admin employees
          // Apply visibility rules based on logged-in user
          if (currentUser.authority === "Owner") {
            // ✅ Owner sees everything (no filter)
          } else if (currentUser.authority === "Admin") {
            // ✅ Admin sees only LOWER roles
            employees = employees.filter(
              (emp) =>
                authorityPriority[emp.authority] > authorityPriority["Admin"],
            );
          } else if (
            currentUser.authority === "Administration" ||
            currentUser.authority === "Employee"
          ) {
            // ❌ No access
            employees = [];
          }

          // Sort by priority
          employees.sort(
            (a, b) =>
              (authorityPriority[a.authority] || 999) -
              (authorityPriority[b.authority] || 999),
          );

          allEmployees = employees;
          renderData(allEmployees);
        } catch (err) {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="5" class="py-16 text-red-600 text-center">Failed to load employees</td></tr>`;
          mobileContainer.innerHTML = `<div class="text-center py-10 text-red-600">Failed to load employees</div>`;
        }
      }

      async function openEditModal(empId) {
        try {
          const res = await fetch(`/api/employees/${empId}`, {
            credentials: "include",
          });

          if (!res.ok) {
            throw new Error("Failed to fetch employee");
          }

          const emp = await res.json();

          // 🔒 Permission check
          if (!canEdit(emp.authority)) {
            return alert(
              "❌ You cannot edit this user (higher or same authority)",
            );
          }

          editingId = empId;

          // ✅ Fill form fields
          document.getElementById("edit-name").value = emp.employee_name || "";
          document.getElementById("edit-empid").value = emp.employee_id;
          document.getElementById("edit-password").value = emp.password || "";

          // ✅ Populate authority dropdown
          const select = document.getElementById("edit-authority");
          select.innerHTML = "";

          const allowed = assignableAuthorities[currentUser.authority] || [];

          allowed.forEach((auth) => {
            const option = document.createElement("option");
            option.value = auth;
            option.textContent = auth;

            if (auth === emp.authority) {
              option.selected = true;
            }

            select.appendChild(option);
          });

          // ✅ Open modal
          const modal = document.getElementById("edit-modal");
          modal.classList.remove("hidden");
          modal.classList.add("flex");
        } catch (err) {
          console.error(err);
          alert("❌ Failed to load employee details");
        }
      }

      function renderData(employees) {
        const tbody = document.getElementById("employee-table");
        const mobileContainer = document.getElementById("mobile-cards");

        tbody.innerHTML = "";
        mobileContainer.innerHTML = "";

        if (employees.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-16 text-center text-gray-500">No employees found</td></tr>`;
          mobileContainer.innerHTML = `<div class="text-center py-10 text-gray-500">No employees found</div>`;
          return;
        }

        employees.forEach((emp) => {
          const currentClass =
            roleClasses[emp.authority] || "bg-gray-200 text-gray-800";

          // Desktop Row
          const tr = document.createElement("tr");
          tr.className = "border-t hover:bg-gray-50";
          tr.innerHTML = `
                      <td class="px-8 py-6 font-medium">${emp.employee_name}</td>
                      <td class="px-8 py-6 font-mono">${emp.employee_id}</td>
                      <td class="px-8 py-6">
                        <span class="px-4 py-1.5 rounded-full text-xs font-medium ${currentClass}">${emp.authority}</span>
                      </td>
                      <td class="px-8 py-6 font-mono text-amber-700">${emp.password || "—"}</td>
                      <td class="px-8 py-6 text-center">
                       ${
                         canEdit(emp.authority)
                           ? `<button onclick="openEditModal('${emp.employee_id}')"
                    class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-sm flex items-center gap-2">
                    <i class="fas fa-edit"></i> Edit
                  </button>`
                           : `<span class="text-gray-400 text-sm">No Access</span>`
                       }
                      </td>
                    `;
          tbody.appendChild(tr);

          // Mobile Card
          const card = document.createElement("div");
          card.className = "mobile-card bg-white p-6 rounded-2xl shadow border";
          card.innerHTML = `
                      <div class="flex justify-between items-start">
                        <div>
                          <h3 class="font-semibold text-lg">${emp.employee_name}</h3>
                          <p class="text-sm text-gray-500">${emp.employee_id}</p>
                        </div>
                        <span class="px-4 py-1 rounded-full text-xs font-medium ${currentClass}">${emp.authority}</span>
                      </div>
                      <div class="mt-4 flex justify-between items-center">
                        <div class="text-amber-700 font-mono">Password: <strong>${emp.password || "—"}</strong></div>
                        <button onclick="openEditModal('${emp.employee_id}')"
                          class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm flex items-center gap-2">
                          <i class="fas fa-edit"></i> Edit
                        </button>
                      </div>
                    `;
          mobileContainer.appendChild(card);
        });
      }

      function filterData() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const filtered = allEmployees.filter(
          (emp) =>
            (emp.employee_name || "").toLowerCase().includes(query) ||
            (emp.employee_id || "").toLowerCase().includes(query) ||
            (emp.authority || "").toLowerCase().includes(query),
        );
        renderData(filtered);
      }

      async function openEditModal(empId) {
        try {
          const res = await fetch(`/api/employees/${empId}`, {
            credentials: "include",
          });
          const emp = await res.json();
          editingId = empId;

          document.getElementById("edit-name").value = emp.employee_name || "";
          document.getElementById("edit-empid").value = emp.employee_id;
          document.getElementById("edit-password").value = emp.password || "";

          const select = document.getElementById("edit-authority");
          select.innerHTML = "";
          const allowed = assignableAuthorities[currentUser.authority] || [];
          allowed.forEach((auth) => {
            const opt = document.createElement("option");
            opt.value = auth;
            opt.textContent = auth;
            if (auth === emp.authority) opt.selected = true;
            select.appendChild(opt);
          });

          document.getElementById("edit-modal").classList.remove("hidden");
          document.getElementById("edit-modal").classList.add("flex");
        } catch (err) {
          alert("Failed to load employee details");
        }
      }
      function canEdit(targetAuthority) {
        if (!currentUser) return false;

        const current = authorityPriority[currentUser.authority];
        const target = authorityPriority[targetAuthority];

        // 🔥 STRICT RULE
        return current < target;
      }

      function closeModal() {
        const modal = document.getElementById("edit-modal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }

      async function saveEmployeeChanges() {
        if (!editingId) return;

        const name = document.getElementById("edit-name").value.trim();
        const authority = document.getElementById("edit-authority").value;
        const password = document.getElementById("edit-password").value.trim();

        if (!name || !password) return alert("Name and Password are required");

        try {
          const res = await fetch(`/api/employees/${editingId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ employee_name: name, authority, password }),
          });

          if (!res.ok) throw new Error("Failed to update");

          alert("✅ Changes saved successfully!");
          closeModal();
          loadEmployees();
        } catch (err) {
          alert("❌ Failed to save changes");
        }
      }

      window.onload = init;
    </script>
  </body>
</html>
