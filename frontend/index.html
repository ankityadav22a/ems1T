<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Exact same anti-flash styles as Notice page -->
    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- Layout injection point -->
    <div id="nav-placeholder"></div>

    <!-- Wrapped in #main-content for controlled fade-in -->
    <div id="main-content" class="ml-0 md:ml-64 mt-20 p-4">
      <!-- DASHBOARD -->
      <section class="mb-8">
        <h2 class="text-xl font-semibold mb-4">Dashboard</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Skeleton dashboard cards -->
          <div class="bg-white p-4 rounded shadow animate-pulse">
            <div class="skeleton h-6 w-3/5 rounded mb-2"></div>
            <div class="skeleton h-8 w-1/2 rounded"></div>
          </div>
          <div
            class="bg-white p-4 rounded shadow animate-pulse hidden sm:block"
          >
            <div class="skeleton h-6 w-3/5 rounded mb-2"></div>
            <div class="skeleton h-8 w-1/2 rounded"></div>
          </div>
          <div
            class="bg-white p-4 rounded shadow animate-pulse hidden lg:block"
          >
            <div class="skeleton h-6 w-3/5 rounded mb-2"></div>
            <div class="skeleton h-8 w-1/2 rounded"></div>
          </div>
          <div
            class="bg-white p-4 rounded shadow animate-pulse hidden lg:block"
          >
            <div class="skeleton h-6 w-3/5 rounded mb-2"></div>
            <div class="skeleton h-8 w-1/2 rounded"></div>
          </div>
        </div>
      </section>

      <!-- EMPLOYEES -->
      <section class="mb-8">
        <h2 class="text-xl font-semibold mb-4">Employees</h2>

        <div class="overflow-x-auto bg-white rounded shadow">
          <table class="w-full text-left">
            <thead class="bg-gray-700 text-white">
              <tr>
                <th class="p-2">ID</th>
                <th class="p-2">Name</th>
                <th class="p-2">Department</th>
                <th class="p-2">Position</th>
                <th class="p-2">Status</th>
              </tr>
            </thead>
            <tbody id="employeeTable">
              <!-- Skeleton employee rows -->
              <tr class="border-b">
                <td colspan="5" class="p-4">
                  <div class="skeleton h-6 w-3/4 rounded"></div>
                </td>
              </tr>
              <tr class="border-b">
                <td colspan="5" class="p-4">
                  <div class="skeleton h-6 w-1/2 rounded"></div>
                </td>
              </tr>
              <tr class="border-b">
                <td colspan="5" class="p-4">
                  <div class="skeleton h-6 w-2/3 rounded"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- DEPARTMENTS -->
      <section class="mb-8">
        <h2 class="text-xl font-semibold mb-4">Departments</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <!-- Skeleton department cards -->
          <div class="bg-white p-3 rounded shadow animate-pulse">
            <div class="skeleton h-6 w-1/3 rounded"></div>
          </div>
          <div
            class="bg-white p-3 rounded shadow animate-pulse hidden sm:block"
          >
            <div class="skeleton h-6 w-1/3 rounded"></div>
          </div>
          <div
            class="bg-white p-3 rounded shadow animate-pulse hidden lg:block"
          >
            <div class="skeleton h-6 w-1/3 rounded"></div>
          </div>
          <div
            class="bg-white p-3 rounded shadow animate-pulse hidden lg:block"
          >
            <div class="skeleton h-6 w-1/3 rounded"></div>
          </div>
          <div
            class="bg-white p-3 rounded shadow animate-pulse hidden lg:block"
          >
            <div class="skeleton h-6 w-1/3 rounded"></div>
          </div>
        </div>
      </section>

      <!-- REPORTS -->
      <section>
        <h2 class="text-xl font-semibold mb-4">Reports</h2>

        <div class="flex flex-wrap gap-3">
          <div class="skeleton h-10 w-32 rounded">nvodno</div>
          <div class="skeleton h-10 w-32 rounded"></div>
          <div class="skeleton h-10 w-24 rounded"></div>
        </div>
      </section>
    </div>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-white text-center p-3 mt-6">
      © 2024 Employee Management System
    </footer>

    <script src="load-layout.js"></script>
    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
      }

      // ── Exact same reveal logic as Notice page ─────────────────────────────
      function initializePage() {
        document.getElementById("main-content").classList.add("ready");

        // Highlight active menu link (Dashboard)
        setTimeout(() => {
          const link = document.querySelector('a[href="index.html"]');
          if (link) {
            link.classList.add("bg-blue-700", "font-semibold");
            link.classList.remove("hover:bg-blue-600");
          }
        }, 400);
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initializePage, 300);
      });
    </script>
  </body>
</html>
