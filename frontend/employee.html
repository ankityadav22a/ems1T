<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!-- HEADER -->
    <header
      class="fixed top-0 left-0 w-full bg-blue-900 text-white p-4 flex justify-between items-center z-50 shadow"
    >
      <!-- LEFT -->
      <div class="flex items-center gap-3">
        <img src="./EMSlogo.jpg" class="h-10" />
      </div>

      <!-- RIGHT -->
      <div class="flex items-center gap-4">
        <img
          src="./back.png"
          onclick="history.back()"
          class="h-8 w-8 cursor-pointer hover:scale-110 transition"
          title="Go Back"
        />
      </div>
    </header>

    <!-- SIDEBAR -->
    <div
      class="fixed left-0 top-16 h-[calc(100%-4rem)] w-56 bg-[#1f2937] text-white p-5 overflow-y-auto"
    >
      <h2 class="text-xl font-bold mb-6">EMS Menu</h2>

      <ul class="flex flex-col gap-3">
        <li>
          <a href="index.html" class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Dashboard</a
          >
        </li>
        <li>
          <a href="employee.html" class="block px-4 py-2 bg-blue-600 rounded"
            >Employees</a
          >
        </li>
        <li>
          <a
            href="projects.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Projects</a
          >
        </li>
        <li>
          <a
            href="leaves.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Leaves</a
          >
        </li>
        <li>
          <a
            href="document.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Document</a
          >
        </li>
        <li>
          <a
            href="profile.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Profile</a
          >
        </li>
        <li>
          <a
            href="payroll.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Payroll</a
          >
        </li>
        <li>
          <a
            href="clients.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Clients</a
          >
        </li>
        <li>
          <a
            href="reports.html"
            class="block px-4 py-2 hover:bg-blue-600 rounded"
            >Reports</a
          >
        </li>
      </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="ml-0 md:ml-56 mt-20 p-4 md:p-8">
      <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">
        Employee Management
      </h1>

      <!-- ADD EMPLOYEE -->
      <div class="bg-white p-4 md:p-6 rounded shadow mb-6">
        <h2 class="text-lg font-semibold mb-4">Add Employee</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input
            id="name"
            placeholder="Employee Name"
            class="border p-2 rounded"
          />
          <input
            id="department"
            placeholder="Department"
            class="border p-2 rounded"
          />
          <input
            id="project"
            placeholder="Project"
            class="border p-2 rounded"
          />
          <input id="joinDate" type="date" class="border p-2 rounded" />
        </div>

        <button
          onclick="addEmployee()"
          class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full md:w-auto"
        >
          Add Employee
        </button>
      </div>

      <!-- SEARCH -->
      <input
        id="search"
        onkeyup="searchEmployee()"
        placeholder="Search by name / department / project..."
        class="mb-4 w-full md:w-1/3 border p-2 rounded shadow"
      />

      <!-- TABLE -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left min-w-[600px]">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Department</th>
              <th class="p-3">Project</th>
              <th class="p-3">Join Date</th>
            </tr>
          </thead>
          <tbody id="employeeTable"></tbody>
        </table>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      let employees = JSON.parse(localStorage.getItem("employees")) || [
        {
          id: 1,
          name: "John Doe",
          department: "IT",
          project: "Website",
          joinDate: "2024-01-10",
        },
        {
          id: 2,
          name: "Jane Smith",
          department: "HR",
          project: "Recruitment",
          joinDate: "2024-02-15",
        },
      ];

      renderTable();

      function renderTable(list = employees) {
        let table = document.getElementById("employeeTable");
        table.innerHTML = "";

        list.forEach((emp) => {
          table.innerHTML += `
<tr class="border-b hover:bg-gray-50">
<td class="p-3">${emp.id}</td>
<td class="p-3">${emp.name}</td>
<td class="p-3">${emp.department}</td>
<td class="p-3">${emp.project}</td>
<td class="p-3">${emp.joinDate}</td>
</tr>`;
        });

        localStorage.setItem("employees", JSON.stringify(employees));
      }

      function addEmployee() {
        let name = document.getElementById("name").value.trim();
        let department = document.getElementById("department").value.trim();
        let project = document.getElementById("project").value.trim();
        let joinDate = document.getElementById("joinDate").value;

        if (!name || !department || !project || !joinDate) {
          alert("Fill all fields");
          return;
        }

        let newEmployee = {
          id: Date.now(), // unique ID
          name,
          department,
          project,
          joinDate,
        };

        employees.push(newEmployee);
        renderTable();

        document.getElementById("name").value = "";
        document.getElementById("department").value = "";
        document.getElementById("project").value = "";
        document.getElementById("joinDate").value = "";
      }

      function searchEmployee() {
        let keyword = document.getElementById("search").value.toLowerCase();

        let filtered = employees.filter(
          (emp) =>
            emp.name.toLowerCase().includes(keyword) ||
            emp.department.toLowerCase().includes(keyword) ||
            emp.project.toLowerCase().includes(keyword),
        );

        renderTable(filtered);
      }
    </script>
  </body>
</html>
