<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Exact same anti-flash styles as Notice page -->
    <style>
      #main-content {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #main-content.ready {
        opacity: 1;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- Layout injection point -->
    <div id="nav-placeholder"></div>

    <!-- Wrapped in #main-content for controlled fade-in -->
    <div id="main-content" class="md:ml-56 mt-20 p-4 md:p-8">
      <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">
        Employee Management
      </h1>

      <!-- ADD EMPLOYEE -->
      <div class="bg-white p-4 md:p-6 rounded shadow mb-6">
        <h2 class="text-lg font-semibold mb-4">Add Employee</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input
            id="name"
            placeholder="Employee Name"
            class="border p-2 rounded"
          />
          <input
            id="department"
            placeholder="Department"
            class="border p-2 rounded"
          />
          <input
            id="project"
            placeholder="Project"
            class="border p-2 rounded"
          />
          <input id="joinDate" type="date" class="border p-2 rounded" />
        </div>

        <button
          onclick="addEmployee()"
          class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full md:w-auto"
        >
          Add Employee
        </button>
      </div>

      <!-- SEARCH -->
      <input
        id="search"
        onkeyup="searchEmployee()"
        placeholder="Search by name / department / project..."
        class="mb-4 w-full md:w-1/3 border p-2 rounded shadow"
      />

      <!-- TABLE with immediate skeletons -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left min-w-[600px]">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Department</th>
              <th class="p-3">Project</th>
              <th class="p-3">Join Date</th>
            </tr>
          </thead>
          <tbody id="employeeTable">
            <!-- Skeleton rows – visible instantly before JS runs -->
            <tr>
              <td colspan="5" class="p-4">
                <div class="skeleton h-6 w-3/4 rounded"></div>
              </td>
            </tr>
            <tr>
              <td colspan="5" class="p-4">
                <div class="skeleton h-6 w-1/2 rounded"></div>
              </td>
            </tr>
            <tr>
              <td colspan="5" class="p-4">
                <div class="skeleton h-6 w-2/3 rounded"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- SCRIPT -->
    <script src="load-layout.js"></script>
    <script>
      let employees = JSON.parse(localStorage.getItem("employees")) || [
        {
          id: 1,
          name: "John Doe",
          department: "IT",
          project: "Website",
          joinDate: "2024-01-10",
        },
        {
          id: 2,
          name: "Jane Smith",
          department: "HR",
          project: "Recruitment",
          joinDate: "2024-02-15",
        },
      ];

      function renderTable(list = employees) {
        let table = document.getElementById("employeeTable");
        table.innerHTML = "";

        list.forEach((emp) => {
          table.innerHTML += `
<tr class="border-b hover:bg-gray-50">
<td class="p-3">${emp.id}</td>
<td class="p-3">${emp.name}</td>
<td class="p-3">${emp.department}</td>
<td class="p-3">${emp.project}</td>
<td class="p-3">${emp.joinDate}</td>
</tr>`;
        });

        localStorage.setItem("employees", JSON.stringify(employees));
      }

      function addEmployee() {
        let name = document.getElementById("name").value.trim();
        let department = document.getElementById("department").value.trim();
        let project = document.getElementById("project").value.trim();
        let joinDate = document.getElementById("joinDate").value;

        if (!name || !department || !project || !joinDate) {
          alert("Fill all fields");
          return;
        }

        let newEmployee = {
          id: Date.now(), // unique ID
          name,
          department,
          project,
          joinDate,
        };

        employees.push(newEmployee);
        renderTable();

        document.getElementById("name").value = "";
        document.getElementById("department").value = "";
        document.getElementById("project").value = "";
        document.getElementById("joinDate").value = "";
      }

      function searchEmployee() {
        let keyword = document.getElementById("search").value.toLowerCase();

        let filtered = employees.filter(
          (emp) =>
            emp.name.toLowerCase().includes(keyword) ||
            emp.department.toLowerCase().includes(keyword) ||
            emp.project.toLowerCase().includes(keyword),
        );

        renderTable(filtered);
      }

      // ── Exact same reveal logic as Notice page ─────────────────────────────
      function initializePage() {
        renderTable();
        document.getElementById("main-content").classList.add("ready");

        // Highlight active menu link
        setTimeout(() => {
          const link = document.querySelector('a[href="employee.html"]');
          if (link) {
            link.classList.add("bg-blue-700", "font-semibold");
            link.classList.remove("hover:bg-blue-600");
          }
        }, 400);
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initializePage, 300);
      });
    </script>
  </body>
</html>
